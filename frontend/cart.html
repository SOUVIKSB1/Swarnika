<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Cart — Swarnika Jewels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="chat.css" />
    <script type="module" src="firebase.js" defer></script>
    <script src="apiHelper.js" defer></script>
    <script defer src="navbar.js"></script>
    <script defer src="chat.js"></script>
    <style>
      .hover-gold:hover {
        color: var(--gold-light) !important;
        text-decoration: underline !important;
        transition: color 0.2s ease;
      }
      .modal-backdrop {
        background-color: rgba(14, 12, 10, 0.85) !important;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #onlinePaymentDetails input {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--r-md, 8px);
      }
      #onlinePaymentDetails input:focus {
        border-color: var(--gold-light);
        box-shadow: 0 0 0 3px rgba(226, 201, 126, 0.15);
      }
      .animate-hover-scale {
        transition: transform 0.3s ease;
      }
      .animate-hover-scale:hover {
        transform: scale(1.08);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg" role="navigation" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
          <img src="image.png" alt="Swarnika Logo" class="brand-logo" />
          <span>Swarnika Jewels</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="cart.html">Cart <span class="cart-count"></span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html?history=true">Order History</a>
            </li>
            <li class="nav-item d-none">
              <a class="nav-link" href="admin.html">Admin Panel</a>
            </li>
            <li class="nav-item d-none" id="userNameDisplay">
              <span class="nav-link text-primary fw-bold"></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="loginBtn" href="login.html">Login</a>
            </li>
            <li class="nav-item d-none" id="logoutContainer">
              <a class="nav-link" href="#" id="logoutBtn">Logout</a>

          </ul>
        </div>
      </div>

    <main class="cart-container">
      <h2 class="text-center mb-4">🛒 Your Shopping Cart</h2>
      <div id="cartArea">
        <div class="text-center py-5 text-muted">⏳ Loading your cart...</div>
      </div>
      <div
        id="checkoutArea"
        class="checkout-section mt-4"
        style="display: none"
      ></div>
      <div id="postPurchase" class="text-center mt-4"></div>
    </main>

    <!-- Checkout Modal (Premium Pop-up Slide) -->
    <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: rgba(26, 23, 16, 0.98); border: 1px solid rgba(201, 168, 76, 0.25); border-radius: 20px; box-shadow: var(--shadow-xl); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
          <div class="modal-header" style="border-bottom: 1px solid rgba(201, 168, 76, 0.15);">
            <h5 class="modal-title fw-bold" id="checkoutModalLabel" style="font-family:'Cormorant Garamond',serif; font-size:1.6rem; color:var(--gold-light);">✨ Secure Checkout</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" style="background-size: 0.8em;"></button>
          </div>
          <div class="modal-body p-4">
            <form id="checkoutForm">
              <div class="mb-3">
                <label class="form-label" for="shipping_address">Shipping Address</label>
                <textarea id="shipping_address" class="form-control" rows="3" placeholder="Enter your full shipping address" required style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text);"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label" for="payment_mode">Payment Mode</label>
                <select id="payment_mode" class="form-select" style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text);">
                  <option value="COD" style="background: var(--surface-2); color: var(--text);">Cash on Delivery (COD)</option>
                  <option value="Online" style="background: var(--surface-2); color: var(--text);">Online Payment (Card / UPI)</option>
                </select>
              </div>
              
              <!-- Online Payment Details (Slide Down Interface) -->
              <div id="onlinePaymentDetails" style="display: none; background: rgba(201, 168, 76, 0.05); border: 1px solid rgba(201, 168, 76, 0.2); border-radius: 12px; transition: all 0.3s ease;" class="p-3 mb-3">
                <div class="mb-3">
                  <label class="form-label" for="card_number">Card Number</label>
                  <input type="text" class="form-control" placeholder="4111 2222 3333 4444" maxlength="19" id="card_number">
                </div>
                <div class="row">
                  <div class="col-6 mb-2">
                    <label class="form-label" for="card_expiry">Expiry Date</label>
                    <input type="text" class="form-control" placeholder="MM/YY" maxlength="5" id="card_expiry">
                  </div>
                  <div class="col-6 mb-2">
                    <label class="form-label" for="card_cvv">CVV</label>
                    <input type="password" class="form-control" placeholder="•••" maxlength="3" id="card_cvv">
                  </div>
                </div>
              </div>
              
              <button type="submit" class="btn btn-primary w-100 btn-lg mt-2" style="font-size: 1.05rem;">Place Secure Order</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;letter-spacing:1.5px;background:linear-gradient(135deg,#c9a84c,#e2c97e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.3rem">Swarnika Jewels</div>
      <div style="color:rgba(255,255,255,0.4);font-size:0.82rem">&copy; All rights reserved &middot; Developed by Souvik Sinhababu</div>
    </footer>

    <script type="module">
      import "./config.js";
      const API = window.API || "/api";
      const PLACEHOLDER_DATAURI = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="100%" height="100%" fill="%23f3f3f3"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23888" font-size="16">No%20image</text></svg>';
      const cartArea = document.getElementById("cartArea");
      const checkoutArea = document.getElementById("checkoutArea");
      const postPurchase = document.getElementById("postPurchase");
      let cartItems = [];
      let demoInjected = false;
      let _prevCartSig = "";
      let _loading = false;

      document.addEventListener("DOMContentLoaded", () => {
        loadCart();
        
        // Attach payment mode toggler
        const paymentModeSelect = document.getElementById('payment_mode');
        if (paymentModeSelect) {
          paymentModeSelect.addEventListener('change', (e) => {
            const details = document.getElementById('onlinePaymentDetails');
            const cardNum = document.getElementById('card_number');
            const cardExp = document.getElementById('card_expiry');
            const cardCvv = document.getElementById('card_cvv');
            if (e.target.value === 'Online') {
              details.style.display = 'block';
              cardNum.required = true;
              cardExp.required = true;
              cardCvv.required = true;
            } else {
              details.style.display = 'none';
              cardNum.required = false;
              cardExp.required = false;
              cardCvv.required = false;
              cardNum.value = '';
              cardExp.value = '';
              cardCvv.value = '';
            }
          });
        }

        // Attach placeOrder listener
        const checkoutForm = document.getElementById("checkoutForm");
        if (checkoutForm) {
          checkoutForm.addEventListener("submit", placeOrder);
        }
      });

      // showLoader: when false, skip showing the full-page loader to avoid flicker
      let _lastLoadTs = 0;
      
      function normalizeImageUrl(src) {
        if (!src) return "image.png";
        if (src.startsWith("http://") || src.startsWith("https://") || src.startsWith("data:")) {
          return src;
        }
        let host = window.location.hostname;
        let protocol = location.protocol;
        if (protocol === "file:" || !host) {
          host = "localhost";
          protocol = "http:";
        }
        const port = window.detectedPort || 5001;
        const apiHost = (host === "localhost" || host.startsWith("127.")) ? `${protocol}//${host}:${port}` : "";
        return `${apiHost}${src.startsWith("/") ? "" : "/"}${src}`;
      }

      async function loadCart(showLoader = true, force = false) {
        // Prevent concurrent loads which cause repeated DOM updates/flicker
        const now = Date.now();
        if (!force && _loading) return;
        // Rate limit: avoid calling loadCart more than once per 800ms unless forced
        if (!force && now - _lastLoadTs < 800) return;
        _loading = true;
        _lastLoadTs = now;
        try {
          if (showLoader) {
            cartArea.innerHTML =
              '<div class="text-center py-5"><div class="loader" aria-hidden="true"></div><div class="mt-2 text-muted">Loading your cart...</div></div>';
          }
          // Build headers with auth - JWT token PRIMARY, Firebase token fallback, otherwise use a guestId
            const headers = {};
            const authToken = localStorage.getItem("authToken");
            const firebaseToken = localStorage.getItem("firebaseIdToken");
            let guestId = localStorage.getItem("guestId");

            // Ensure we have a persistent guestId for anonymous users
            if (!authToken && !firebaseToken && !guestId) {
              guestId = `guest_${Date.now()}`;
              localStorage.setItem('guestId', guestId);
              console.log('🆕 Created new guestId:', guestId);
            }

            console.log("💾 localStorage authToken:", authToken ? "✅ Present" : "❌ Missing");
            console.log("💾 localStorage firebaseIdToken:", firebaseToken ? "✅ Present" : "❌ Missing");
            console.log("💾 localStorage guestId:", guestId ? `✅ ${guestId}` : "❌ Missing");

            // --- FIX: send ALL available auth credentials so backend always sees the same set
            if (authToken) {
              headers["x-auth-token"] = authToken;
              console.log("📝 Sending JWT token");
            }
            if (firebaseToken) {
              headers["Authorization"] = `Bearer ${firebaseToken}`;
              console.log("📝 Sending Firebase token");
            }
            if (guestId) {
              headers['x-guest-id'] = guestId; // always send guestId to allow merge
              console.log('📝 Sending guestId (for merge or anonymous):', guestId);
            }

            // If we have an auth token or firebase token, attempt auth/me first to provide user context
            let isAuthenticated = false;
            if (authToken || firebaseToken) {
              let authCheck;
              if (window.fetchWithFallback) {
                authCheck = await window.fetchWithFallback('/auth/me', {
                  credentials: 'include',
                  headers
                });
              } else {
                authCheck = await fetch(`${API}/auth/me`, {
                  credentials: 'include',
                  headers
                });
              }
              if (authCheck.ok) {
                const user = await authCheck.json();
                console.log("✅ User authenticated:", user.email);
                isAuthenticated = true;
                window.currentUserProfile = user;
              } else {
                console.warn('⚠️ Auth check failed, falling back to guest behavior if guestId present');
                if (!guestId) {
                  // Create a guestId and try again
                  const newGuest = `guest_${Date.now()}`;
                  localStorage.setItem('guestId', newGuest);
                  headers['x-guest-id'] = newGuest;
                  console.log('🆕 Created guestId after auth failure:', newGuest);
                }
              }
            }

            // Now fetch cart. If guestId header is set, backend will return guest cart.
            let res;
            if (window.fetchWithFallback) {
              res = await window.fetchWithFallback('/cart', {
                credentials: 'include',
                headers
              });
            } else {
              res = await fetch(`${API}/cart`, {
                credentials: 'include',
                headers
              });
            }

            if (res.status === 401) {
              console.warn("⚠️ Cart fetch returned 401");
              cartArea.innerHTML =
                '<div class="alert alert-danger">Your session expired. Please <a href="login.html">login</a> again.</div>';
              return;
            }
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to load cart");

            const items = data.items || [];
            if (!items || items.length === 0) {
              cartArea.innerHTML = '<div class="alert alert-secondary text-center">Your shopping cart is empty.</div>';
              checkoutArea.style.display = "none";
              document.querySelectorAll(".cart-count").forEach((el) => {
                el.textContent = "";
              });
              return;
            }

            cartItems = items.map(item => ({
              _id: item._id,
              productId: item.product?._id || item.product || '',
              name: item.product?.name || item.name || 'Unknown Product',
              image: item.product?.image || item.image || PLACEHOLDER_DATAURI,
              price_at_add: item.price_at_add || item.product?.price || 0,
              quantity: item.quantity || 1
            }));

            renderCart();
            renderCheckout();
            updateCartCountUIFromCartItems();
        } catch (err) {
          console.error("❌ Cart load error:", err);
          cartArea.innerHTML = `<div class="alert alert-danger text-center">Error loading cart: ${err.message}</div>`;
          checkoutArea.style.display = "none";
        } finally {
          _loading = false;
        }
      }

      function renderCart() {
        // Avoid re-rendering if cart items haven't changed to prevent flicker
        try {
          const sig = cartItems.map(i => `${i._id}:${i.quantity}`).join('|');
          if (sig === _prevCartSig) return; // no changes, skip DOM update
          _prevCartSig = sig;
        } catch (e) {
          _prevCartSig = "";
        }
        // Try to do a DOM-diffed update to avoid replacing entire table (reduces flicker)
        const container = cartArea.querySelector('table');
        if (!container) {
          // First render: build full table
          cartArea.innerHTML = generateCartTableHTML(cartItems);
          // attach listeners for all rows
          cartArea.querySelectorAll('.qty-input').forEach((input) => input.addEventListener('change', updateQuantity));
          cartArea.querySelectorAll('.remove-btn').forEach((btn) => btn.addEventListener('click', removeItem));
          return;
        }

        // Subsequent renders: update rows selectively
        const tbody = cartArea.querySelector('tbody');
        if (!tbody) {
          cartArea.innerHTML = generateCartTableHTML(cartItems);
          cartArea.querySelectorAll('.qty-input').forEach((input) => input.addEventListener('change', updateQuantity));
          cartArea.querySelectorAll('.remove-btn').forEach((btn) => btn.addEventListener('click', removeItem));
          return;
        }

        // Map current rows
        const existingRows = Array.from(tbody.querySelectorAll('tr'));
        const existingMap = new Map(existingRows.map(r => [r.dataset.id, r]));

        // Add or update rows
        cartItems.forEach((item, idx) => {
          const isDemoRow = typeof item._id === 'string' && item._id.startsWith('demo-');
          const displayPrice = item.price_at_add;
          const isSurcharge = idx === 2 || idx === 3;
          const adjustedPrice = Math.round(item.price_at_add * (isSurcharge ? 1.2 : 1.0));
          const id = item._id;
          const existing = existingMap.get(id);
          if (existing) {
            // update quantity and total if changed
            const input = existing.querySelector('.qty-input');
            if (input && parseInt(input.value) !== item.quantity) input.value = item.quantity;
            const totalEl = existing.querySelector('.item-total');
            const wantedTotal = `₹${(item.quantity * adjustedPrice).toLocaleString()}`;
            if (totalEl && totalEl.textContent !== wantedTotal) totalEl.textContent = wantedTotal;
            // update name/price badges if demo status changed
            existing.classList.toggle('demo-row', isDemoRow);
          } else {
            // append new row
            const temp = document.createElement('tbody');
            temp.innerHTML = generateCartRowHTML(item, idx);
            const newRow = temp.querySelector('tr');
            tbody.appendChild(newRow);
            // attach listeners for new row
            const input = newRow.querySelector('.qty-input');
            if (input) input.addEventListener('change', updateQuantity);
            const btn = newRow.querySelector('.remove-btn');
            if (btn) btn.addEventListener('click', removeItem);
          }
        });

        // Remove rows that are no longer present
        const currentIds = new Set(cartItems.map(i => String(i._id)));
        existingRows.forEach(r => {
          if (!currentIds.has(r.dataset.id)) r.remove();
        });
      }

      // Update navbar cart count using the local cartItems (so demo items are reflected)
      function updateCartCountUIFromCartItems() {
        const count = cartItems.reduce((sum, item) => sum + (item.quantity || 0), 0);
        document.querySelectorAll(".cart-count").forEach((el) => {
          el.textContent = count > 0 ? `(${count})` : "";
        });
      }

      function renderCheckout() {
        let subtotal = 0;
        let surchargeApplied = false;
        cartItems.forEach((item, idx) => {
          const isSurcharge = idx === 2 || idx === 3;
          const multiplier = isSurcharge ? 1.2 : 1.0;
          const adjustedPrice = Math.round(item.price_at_add * multiplier);
          if (isSurcharge) surchargeApplied = true;
          subtotal += item.quantity * adjustedPrice;
        });

        const makingCharges = Math.round(subtotal * 0.10);
        const gst = Math.round(subtotal * 0.03);
        const grandTotal = subtotal + makingCharges + gst;

        checkoutArea.innerHTML = `
        <div class="card p-4 mt-4" style="background: var(--grad-card); border: 1px solid var(--border); border-radius: var(--r-lg);">
          <h4 class="text-center mb-4 fw-bold" style="font-family:'Cormorant Garamond',serif; color:var(--gold-light); font-size: 1.5rem; letter-spacing: 1px;">Order Summary</h4>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-muted small">Subtotal</span>
            <span class="fw-semibold text-white">₹${subtotal.toLocaleString()}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-muted small">Making Charges (10%)</span>
            <span class="fw-semibold text-white">₹${makingCharges.toLocaleString()}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom border-secondary" style="border-bottom-style: dashed !important;">
            <span class="text-muted small">GST (3%)</span>
            <span class="fw-semibold text-white">₹${gst.toLocaleString()}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0 fw-bold" style="color: var(--gold-light);">Grand Total</h5>
            <h4 class="mb-0 fw-bold text-white" id="subtotal">₹${grandTotal.toLocaleString()}</h4>
          </div>
          ${surchargeApplied ? `<p class="small text-muted mt-2">Note: A special surcharge of <strong>+20%</strong> has been applied to items 3 and 4.</p>` : ''}
          <button id="btnOpenCheckout" class="btn btn-primary w-100 btn-lg">Proceed to Checkout</button>
        </div>
        `;
        checkoutArea.style.display = "block";

        const checkoutModalEl = document.getElementById('checkoutModal');
        let checkoutModal = bootstrap.Modal.getInstance(checkoutModalEl);
        if (!checkoutModal) {
          checkoutModal = new bootstrap.Modal(checkoutModalEl);
        }

        document.getElementById('btnOpenCheckout').addEventListener('click', () => {
          const isLoggedIn = localStorage.getItem("authToken") || localStorage.getItem("firebaseIdToken");
          if (!isLoggedIn) {
            if (confirm("🔐 You must be logged in to checkout. Would you like to go to the login page now?")) {
              window.location.href = "login.html?redirect=cart.html";
            }
            return;
          }
          if (window.currentUserProfile && window.currentUserProfile.address) {
            document.getElementById("shipping_address").value = window.currentUserProfile.address;
          }
          checkoutModal.show();
        });
      }

      // Helpers to generate HTML for full table or single row (used for diffing)
      function generateCartTableHTML(items) {
        return `
        <table class="table align-middle product-fade-in">
          <thead>
            <tr>
              <th scope="col">Product</th>
              <th scope="col">Price</th>
              <th scope="col">Quantity</th>
              <th scope="col">Total</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            ${items.map((item, idx) => generateCartRowHTML(item, idx)).join('')}
          </tbody>
        </table>
      `;
      }

      function generateCartRowHTML(item, idx) {
        const isSurcharge = idx === 2 || idx === 3;
        const displayPrice = item.price_at_add;
        const adjustedPrice = Math.round(item.price_at_add * (isSurcharge ? 1.2 : 1.0));
        const isDemoRow = typeof item._id === 'string' && item._id.startsWith('demo-');
        return `
              <tr data-id="${item._id}" class="${isDemoRow ? 'demo-row' : ''}">
                <td>
                  <div class="d-flex align-items-center gap-3">
                    <img src="${normalizeImageUrl(item.image)}" class="rounded animate-hover-scale" style="width: 60px; height: 60px; object-fit: cover; border: 1px solid var(--border);" onerror="this.src='image.png'" />
                    <div>
                      ${isDemoRow ? `<span class="demo-name fw-semibold text-white d-block">${item.name}</span> <span class="demo-badge">Demo</span>` : `<a href="product.html?id=${item.productId}" class="fw-semibold text-white hover-gold d-block">${item.name}</a>`}
                    </div>
                  </div>
                </td>
                <td>₹${displayPrice.toLocaleString()}${isSurcharge ? ` <span class="badge bg-warning text-dark small">+20%</span>` : ""}</td>
                <td style="width: 120px;">
                  <input type="number" class="form-control form-control-sm qty-input" value="${item.quantity}" min="1" style="background: var(--surface-2); border-color: var(--border); color: var(--text);">
                </td>
                <td class="item-total">₹${(item.quantity * adjustedPrice).toLocaleString()}</td>
                <td>
                  <button class="btn btn-sm btn-outline-danger remove-btn">Remove</button>
                </td>
              </tr>
        `;
      }

      async function updateQuantity(e) {
        const input = e.target;
        const itemId = input.closest("tr").dataset.id;
        const newQty = parseInt(input.value);

        const headers = { "Content-Type": "application/json" };
        const authToken = localStorage.getItem("authToken");
        const firebaseToken = localStorage.getItem("firebaseIdToken");
        let guestId = localStorage.getItem('guestId');
        if (!authToken && !firebaseToken && !guestId) {
          guestId = `guest_${Date.now()}`;
          localStorage.setItem('guestId', guestId);
        }

        // JWT token PRIMARY, Firebase token FALLBACK, else guestId
        if (authToken) {
          headers["x-auth-token"] = authToken;
        } else if (firebaseToken) {
          headers["Authorization"] = `Bearer ${firebaseToken}`;
        } else if (guestId) {
          headers['x-guest-id'] = guestId;
        }

        try {
          // If this is a demo item (local-only), update locally without calling backend
          if (itemId && itemId.startsWith('demo-')) {
            const idx = cartItems.findIndex((it) => it._id === itemId);
            if (idx !== -1) {
              cartItems[idx].quantity = newQty;
              renderCart();
              renderCheckout();
              updateCartCountUIFromCartItems();
              return;
            }
          }

          let res;
          if (window.fetchWithFallback) {
            res = await window.fetchWithFallback(`/cart/items/${itemId}`, {
              method: "PUT",
              headers,
              credentials: "include",
              body: JSON.stringify({ quantity: newQty }),
            });
          } else {
            res = await fetch(`${API}/cart/items/${itemId}`, {
              method: "PUT",
              headers,
              credentials: "include",
              body: JSON.stringify({ quantity: newQty }),
            });
          }
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || "Failed to update quantity");
              // Update local cartItems from backend response instead of refetching to prevent flicker
              try {
                const serverItems = (data.cart && data.cart.items) || data.items || [];
                cartItems = serverItems.map(item => ({
                  _id: item._id,
                  productId: item.product?._id || item.product || '',
                  name: item.product?.name || item.name || 'Unknown Product',
                  image: item.product?.image || item.image || PLACEHOLDER_DATAURI,
                  price_at_add: item.price_at_add || item.product?.price || 0,
                  quantity: item.quantity || 1
                }));
                renderCart();
                renderCheckout();
                updateCartCountUIFromCartItems();
              } catch (e) {
                // fallback to silent reload if mapping fails
                await loadCart(false);
              }
        } catch (err) {
          // If backend fails but we have demo items, allow local update
          if (itemId && itemId.startsWith('demo-')) {
            const idx = cartItems.findIndex((it) => it._id === itemId);
            if (idx !== -1) {
              cartItems[idx].quantity = newQty;
              renderCart();
              renderCheckout();
              updateCartCountUIFromCartItems();
              return;
            }
          }
          alert(`Error: ${err.message}`);
          loadCart(false);
        }
      }

      async function removeItem(e) {
        if (!confirm("Remove this item from your cart?")) return;

        const itemId = e.target.closest("tr").dataset.id;
        const headers = {};
        const authToken = localStorage.getItem("authToken");
        const firebaseToken = localStorage.getItem("firebaseIdToken");
        let guestId = localStorage.getItem('guestId');
        if (!authToken && !firebaseToken && !guestId) {
          guestId = `guest_${Date.now()}`;
          localStorage.setItem('guestId', guestId);
        }
        if (authToken) {
          headers["x-auth-token"] = authToken;
        } else if (firebaseToken) {
          headers["Authorization"] = `Bearer ${firebaseToken}`;
        } else if (guestId) {
          headers['x-guest-id'] = guestId;
        }

        try {
          // If demo item, remove locally
          if (itemId && itemId.startsWith('demo-')) {
            cartItems = cartItems.filter((it) => it._id !== itemId);
            renderCart();
            renderCheckout();
            updateCartCountUIFromCartItems();
            return;
          }

          let res;
          if (window.fetchWithFallback) {
            res = await window.fetchWithFallback(`/cart/items/${itemId}`, {
              method: "DELETE",
              credentials: "include",
              headers,
            });
          } else {
            res = await fetch(`${API}/cart/items/${itemId}`, {
              method: "DELETE",
              credentials: "include",
              headers,
            });
          }
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || "Failed to remove item");
              // Update local cartItems from backend response instead of refetching to prevent flicker
              try {
                const serverItems = (data.cart && data.cart.items) || data.items || [];
                cartItems = serverItems.map(item => ({
                  _id: item._id,
                  productId: item.product?._id || item.product || '',
                  name: item.product?.name || item.name || 'Unknown Product',
                  image: item.product?.image || item.image || PLACEHOLDER_DATAURI,
                  price_at_add: item.price_at_add || item.product?.price || 0,
                  quantity: item.quantity || 1
                }));
                renderCart();
                renderCheckout();
                updateCartCountUIFromCartItems();
              } catch (e) {
                await loadCart(false);
              }
        } catch (err) {
          // If backend fails but we have demo items, reflect removal locally
          if (itemId && itemId.startsWith('demo-')) {
            cartItems = cartItems.filter((it) => it._id !== itemId);
            renderCart();
            renderCheckout();
            updateCartCountUIFromCartItems();
            return;
          }
          alert(`Error: ${err.message}`);
        }
      }

      async function placeOrder(e) {
        e.preventDefault();
        const address = document.getElementById("shipping_address").value;
        const payment = document.getElementById("payment_mode").value;

        if (!address.trim()) {
          alert("Please enter a shipping address.");
          return;
        }

        const headers = { "Content-Type": "application/json" };
        const authToken = localStorage.getItem("authToken");
        const firebaseToken = localStorage.getItem("firebaseIdToken");
        let guestId = localStorage.getItem('guestId');
        if (!authToken && !firebaseToken && !guestId) {
          guestId = `guest_${Date.now()}`;
          localStorage.setItem('guestId', guestId);
        }
        if (authToken) {
          headers["x-auth-token"] = authToken;
        } else if (firebaseToken) {
          headers["Authorization"] = `Bearer ${firebaseToken}`;
        } else if (guestId) {
          headers['x-guest-id'] = guestId;
        }

        try {
          let res;
          if (window.fetchWithFallback) {
            res = await window.fetchWithFallback('/orders/checkout', {
              method: "POST",
              headers,
              credentials: "include",
              body: JSON.stringify({
                shipping_address: address,
                payment_mode: payment,
              }),
            });
          } else {
            res = await fetch(`${API}/orders/checkout`, {
              method: "POST",
              headers,
              credentials: "include",
              body: JSON.stringify({
                shipping_address: address,
                payment_mode: payment,
              }),
            });
          }
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Checkout failed");

          // Hide checkout modal
          const checkoutModalEl = document.getElementById('checkoutModal');
          const checkoutModal = bootstrap.Modal.getInstance(checkoutModalEl);
          if (checkoutModal) {
            checkoutModal.hide();
          }

          cartArea.innerHTML = "";
          checkoutArea.innerHTML = "";
          postPurchase.innerHTML = `
          <div class="alert alert-success">
            <h4 class="alert-heading">✅ Order Placed!</h4>
            <p>Your order #${data.order_id} has been successfully placed.</p>
            <hr>
            <a href="orders.html" class="btn btn-success">View My Orders</a>
            <a href="index.html" class="btn btn-outline-secondary">Continue Shopping</a>
          </div>
        `;
          _prevCartSig = "";
          updateCartCount(); // Cart is now empty
        } catch (err) {
          // If backend fails but demo items exist, show a mocked success so demo can proceed
          const hasDemo = cartItems.some(it => typeof it._id === 'string' && it._id.startsWith('demo-')) || demoInjected;
          if (hasDemo) {
            const mockOrderId = `demo_${Date.now()}`;
            
            // Hide checkout modal
            const checkoutModalEl = document.getElementById('checkoutModal');
            const checkoutModal = bootstrap.Modal.getInstance(checkoutModalEl);
            if (checkoutModal) {
              checkoutModal.hide();
            }

            cartArea.innerHTML = "";
            checkoutArea.innerHTML = "";
            postPurchase.innerHTML = `
            <div class="alert alert-success">
              <h4 class="alert-heading">✅ Demo Order Placed!</h4>
              <p>Your demo order #${mockOrderId} has been successfully placed (mocked).</p>
              <hr>
              <a href="orders.html" class="btn btn-success">View My Orders</a>
              <a href="index.html" class="btn btn-outline-secondary">Continue Shopping</a>
            </div>
          `;
              // Persist demo order to localStorage so it appears on Orders page
              try {
                const demoOrder = {
                  id: mockOrderId,
                  items: cartItems.map(it => ({ name: it.name, qty: it.quantity, price: it.price_at_add })),
                  order_total: cartItems.reduce((s, it, idx) => {
                    const mult = (idx === 2 || idx === 3) ? 1.2 : 1.0;
                    return s + Math.round(it.price_at_add * mult) * it.quantity;
                  }, 0),
                  shipping_address: address || 'Demo Address',
                  payment_mode: payment || 'Demo',
                  status: 'Demo',
                  created_at: new Date().toISOString()
                };
                const stored = JSON.parse(localStorage.getItem('demoOrders') || '[]');
                stored.unshift(demoOrder);
                localStorage.setItem('demoOrders', JSON.stringify(stored));
              } catch (e) {
                console.warn('Failed to persist demo order locally', e);
              }

              cartItems = [];
              _prevCartSig = "";
              updateCartCountUIFromCartItems();
            return;
          }

          alert(`Error: ${err.message}`);
        }
      }

      // --- Standard Navbar Functions ---

      async function getCartCount() {
        try {
          // Build headers with auth - JWT token PRIMARY, Firebase token fallback, otherwise use a guestId
          const headers = {};
          const authToken = localStorage.getItem("authToken");
          const firebaseToken = localStorage.getItem("firebaseIdToken");
          let guestId = localStorage.getItem("guestId");

          if (authToken) {
            headers["x-auth-token"] = authToken;
          } else if (firebaseToken) {
            headers["Authorization"] = `Bearer ${firebaseToken}`;
          } else if (guestId) {
            headers['x-guest-id'] = guestId;
          }

          let res;
          if (window.fetchWithFallback) {
            res = await window.fetchWithFallback('/cart', {
              credentials: "include",
              headers
            });
          } else {
            res = await fetch(`${API}/cart`, { 
              credentials: "include",
              headers
            });
          }
          if (!res.ok) return 0;
          const data = await res.json();
          return data.items ? data.items.reduce((sum, item) => sum + (item.quantity || 0), 0) : 0;
        } catch (err) {
          return 0;
        }
      }

      // Debounced updateCartCount: prefer local demo/cartItems when available
      let _cartCountTimer = null;
      async function updateCartCount() {
        // If demo items are present, reflect local state immediately and skip backend fetch
        const hasDemo = demoInjected || cartItems.some(it => typeof it._id === 'string' && it._id.startsWith('demo-'));
        if (hasDemo) {
          updateCartCountUIFromCartItems();
          return;
        }

        // Debounce rapid calls to avoid race conditions between frontend and backend updates
        if (_cartCountTimer) clearTimeout(_cartCountTimer);
        _cartCountTimer = setTimeout(async () => {
          const count = await getCartCount();
          document.querySelectorAll(".cart-count").forEach((el) => {
            el.textContent = count > 0 ? `(${count})` : "";
          });
          _cartCountTimer = null;
        }, 300);
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script>
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    </script>

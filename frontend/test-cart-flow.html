<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart Flow Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
    .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .log { background: #f5f5f5; padding: 10px; border-radius: 4px; max-height: 400px; overflow-y: auto; font-size: 12px; }
    .log-entry { margin: 5px 0; }
    .success { color: green; }
    .error { color: red; }
    .warning { color: orange; }
    .info { color: blue; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Cart Flow Test Suite</h1>
    
    <div class="test-section">
      <h3>Test Controls</h3>
      <button class="btn btn-primary" onclick="testAll()">Run All Tests</button>
      <button class="btn btn-secondary" onclick="clearLogs()">Clear Logs</button>
      <button class="btn btn-warning" onclick="resetLocalStorage()">Reset Storage</button>
    </div>

    <div class="test-section">
      <h3>Individual Tests</h3>
      <button class="btn btn-sm btn-info" onclick="test1()">1. Get/Create guestId</button>
      <button class="btn btn-sm btn-info" onclick="test2()">2. Check API Endpoint</button>
      <button class="btn btn-sm btn-info" onclick="test3()">3. Add Item as Guest</button>
      <button class="btn btn-sm btn-info" onclick="test4()">4. Fetch Guest Cart</button>
      <button class="btn btn-sm btn-info" onclick="test5()">5. Login Flow</button>
      <button class="btn btn-sm btn-info" onclick="test6()">6. Fetch Merged Cart</button>
    </div>

    <div class="test-section">
      <h3>Current State</h3>
      <div id="currentState" style="font-family: monospace; background: #fff3cd; padding: 10px; border-radius: 4px;">
        Loading...
      </div>
    </div>

    <div class="test-section">
      <h3>Test Logs</h3>
      <div class="log" id="logs"></div>
    </div>
  </div>

  <script>
    const API = (function(){ const h = location.hostname; if (h === 'localhost' || h.startsWith('127.')) return `${location.protocol}//${h}:5001/api`; return '/api'; })();
    let testState = { guestId: null, authToken: null, userId: null };

    function log(message, type = 'info') {
      const logs = document.getElementById('logs');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logs.appendChild(entry);
      logs.scrollTop = logs.scrollHeight;
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
      log('Logs cleared');
    }

    function resetLocalStorage() {
      localStorage.clear();
      testState = { guestId: null, authToken: null, userId: null };
      log('✅ localStorage reset', 'success');
      updateState();
    }

    function updateState() {
      const authToken = localStorage.getItem('authToken');
      const guestId = localStorage.getItem('guestId');
      document.getElementById('currentState').innerHTML = `
        <strong>guestId:</strong> ${guestId || '❌ not set'}<br>
        <strong>authToken:</strong> ${authToken ? '✅ set (' + authToken.substring(0, 20) + '...)' : '❌ not set'}<br>
        <strong>API:</strong> ${API}
      `;
      testState = { guestId, authToken };
    }

    async function test1() {
      log('Test 1: Getting/Creating guestId...');
      let guestId = localStorage.getItem('guestId');
      if (!guestId) {
        guestId = `guest_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
        localStorage.setItem('guestId', guestId);
        log(`✅ Created new guestId: ${guestId}`, 'success');
      } else {
        log(`✅ Found existing guestId: ${guestId}`, 'success');
      }
      updateState();
    }

    async function test2() {
      log('Test 2: Checking API endpoint...');
      try {
        const res = await fetch(API + '/products');
        log(`✅ API endpoint accessible (status: ${res.status})`, 'success');
      } catch (err) {
        log(`❌ API endpoint error: ${err.message}`, 'error');
      }
    }

    async function test3() {
      log('Test 3: Adding item to cart as guest...');
      try {
        const guestId = localStorage.getItem('guestId');
        if (!guestId) {
          log('❌ No guestId, run test 1 first', 'error');
          return;
        }

        const res = await fetch(API + '/cart/add', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'x-guest-id': guestId
          },
          body: JSON.stringify({
            productId: '1', // Use first product ID
            quantity: 1,
            guestId: guestId
          })
        });

        const data = await res.json();
        if (res.ok) {
          log(`✅ Added item to guest cart`, 'success');
          log(`Response: ${JSON.stringify(data).substring(0, 100)}...`, 'info');
        } else {
          log(`❌ Failed to add item: ${data.error || res.statusText}`, 'error');
        }
      } catch (err) {
        log(`❌ Cart add error: ${err.message}`, 'error');
      }
    }

    async function test4() {
      log('Test 4: Fetching guest cart...');
      try {
        const guestId = localStorage.getItem('guestId');
        if (!guestId) {
          log('❌ No guestId, run test 1 first', 'error');
          return;
        }

        const res = await fetch(API + '/cart', {
          method: 'GET',
          credentials: 'include',
          headers: {
            'x-guest-id': guestId
          }
        });

        const data = await res.json();
        if (res.ok) {
          const itemCount = data.items ? data.items.length : 0;
          if (itemCount > 0) {
            log(`✅ Fetched guest cart with ${itemCount} item(s)`, 'success');
            log(`Items: ${JSON.stringify(data.items).substring(0, 150)}...`, 'info');
          } else {
            log(`⚠️ Guest cart is empty (no items)`, 'warning');
          }
        } else {
          log(`❌ Failed to fetch cart: ${data.error || res.statusText}`, 'error');
        }
      } catch (err) {
        log(`❌ Cart fetch error: ${err.message}`, 'error');
      }
    }

    async function test5() {
      log('Test 5: Simulating login flow...');
      try {
        // Create a test user
        const res = await fetch(API + '/auth/register', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: `test${Date.now()}@test.com`,
            password: 'Test@123',
            name: 'Test User'
          })
        });

        const data = await res.json();
        if (res.ok) {
          const token = data.token;
          // Persist token only in development (localhost)
          if (location.hostname === 'localhost' || location.hostname.startsWith('127.')) {
            localStorage.setItem('authToken', token);
            log(`✅ Registered/logged in successfully (dev)`, 'success');
            log(`Token: ${token.substring(0, 20)}...`, 'info');
            updateState();
          } else {
            log(`✅ Registered/logged in successfully (not persisted in browser)`, 'success');
          }
        } else {
          log(`❌ Login failed: ${data.error || res.statusText}`, 'error');
        }
      } catch (err) {
        log(`❌ Login error: ${err.message}`, 'error');
      }
    }

    async function test6() {
      log('Test 6: Fetching merged cart after login...');
      try {
        const authToken = localStorage.getItem('authToken');
        const guestId = localStorage.getItem('guestId');
        
        if (!authToken) {
          log('❌ No auth token, run test 5 first', 'error');
          return;
        }

        const res = await fetch(API + '/cart', {
          method: 'GET',
          credentials: 'include',
          headers: {
            'x-auth-token': authToken,
            'x-guest-id': guestId
          }
        });

        const data = await res.json();
        if (res.ok) {
          const itemCount = data.items ? data.items.length : 0;
          if (itemCount > 0) {
            log(`✅ Fetched merged cart with ${itemCount} item(s)`, 'success');
            log(`Items: ${JSON.stringify(data.items).substring(0, 150)}...`, 'info');
          } else {
            log(`⚠️ Merged cart is empty`, 'warning');
          }
        } else {
          log(`❌ Failed to fetch cart: ${data.error || res.statusText}`, 'error');
        }
      } catch (err) {
        log(`❌ Cart fetch error: ${err.message}`, 'error');
      }
    }

    async function testAll() {
      clearLogs();
      log('🚀 Starting complete test suite...', 'info');
      await test1();
      await new Promise(r => setTimeout(r, 500));
      await test2();
      await new Promise(r => setTimeout(r, 500));
      await test3();
      await new Promise(r => setTimeout(r, 500));
      await test4();
      await new Promise(r => setTimeout(r, 500));
      await test5();
      await new Promise(r => setTimeout(r, 500));
      await test6();
      log('✅ Test suite complete', 'success');
    }

    // Initialize
    window.addEventListener('load', () => {
      updateState();
      log('🟢 Test page loaded. Backend: ' + API, 'info');
    });
  </script>
</body>
</html>

    <div class="orders-container">
      <div id="orderArea">
        <div class="text-muted py-5 text-center">
          ⏳ Loading order details...
        </div>
      </div>
    </div>

    <footer class="text-center py-4 mt-auto">
      <div class="container">
        <div style="font-size: 1.35rem; font-weight: 600; letter-spacing: 1.5px" class="mb-2">
          Swarnika Jewels
        </div>
        <div class="mb-1">© Swarnika Jewels | All Rights Reserved</div>
        <div style="font-size: 0.8rem;">
          Project Developed by - Souvik Sinhababu
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const API = (function() {
        let host = window.location.hostname;
        let protocol = location.protocol;
        if (protocol === "file:" || !host) {
          host = "localhost";
          protocol = "http:";
        }
        if (host === 'localhost' || host.startsWith('127.')) {
          return `${protocol}//${host}:5001/api`;
        }
        return '/api';
      })();
      // Helper: small mapping for demo orders stored in localStorage
      function findDemoOrderById(id) {
        try {
          const stored = JSON.parse(localStorage.getItem('demoOrders') || '[]');
          return (stored || []).find(o => o.id === id) || null;
        } catch (e) {
          return null;
        }
      }
      const params = new URLSearchParams(location.search);
      const orderId = params.get("id");

      function initOrderDetailsPage() {
        updateCartCount();
        loadOrderDetails();
      }
      document.addEventListener("DOMContentLoaded", () => {
        if (window.authStateSettled) {
          initOrderDetailsPage();
        } else {
          document.addEventListener("authStateSettled", initOrderDetailsPage, { once: true });
        }
      });

      async function loadOrderDetails() {
        const area = document.getElementById("orderArea");
        if (!orderId) {
          area.innerHTML =
            '<div class="alert alert-danger">No order ID specified.</div>';
          return;
        }

        try {
          // If this is a demo order id (created by frontend), load from localStorage
          if (orderId && orderId.startsWith('demo_')) {
            const demo = findDemoOrderById(orderId);
            if (!demo) {
              area.innerHTML = '<div class="alert alert-warning">Demo order not found.</div>';
              return;
            }

            // Normalize demo items to expected shape
            const items = (demo.items || []).map(it => ({
              name: it.name || it.itemName || 'Item',
              price: typeof it.price !== 'undefined' ? it.price : (it.price_at_add || 0),
              quantity: typeof it.quantity !== 'undefined' ? it.quantity : (it.qty || 1)
            }));

            const order = {
              id: demo.id,
              status: demo.status || 'Demo',
              payment_mode: demo.payment_mode || demo.payment || 'Demo',
              payment_status: demo.payment_status || 'Mock',
              created_at: demo.created_at || new Date().toISOString(),
              order_total: demo.order_total || items.reduce((s,i)=>s + (i.price * i.quantity),0),
              shipping_address: demo.shipping_address || 'Demo Address'
            };

            // Render using the same template structure
            area.innerHTML = renderOrderTemplate(order, items);
            return;
          }

          // Build auth headers
          const headers = {};
          const authToken = localStorage.getItem("authToken");
          const firebaseToken = localStorage.getItem("firebaseIdToken");
          if (authToken) {
            headers["x-auth-token"] = authToken;
          } else if (firebaseToken) {
            headers["Authorization"] = `Bearer ${firebaseToken}`;
          }

          // Otherwise, fetch from backend
          const fetchFn = window.fetchWithFallback || fetch;
          const res = await fetchFn(`/orders/${orderId}`, {
            credentials: "include",
            headers
          });
          if (res.status === 401) {
            area.innerHTML =
              '<div class="alert alert-danger">Please <a href="login.html">login</a> to view this order.</div>';
            return;
          }
          if (res.status === 404) {
            area.innerHTML =
              '<div class="alert alert-warning">Order not found.</div>';
            return;
          }

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to load order");

          let order = null;
          let items = [];
          if (data.order) {
            order = data.order;
            items = data.items || [];
          } else {
            order = {
              id: data._id || data.id,
              status: data.status,
              payment_mode: data.payment_mode,
              payment_status: data.payment_status,
              created_at: data.created_at || data.createdAt,
              order_total: data.order_total,
              shipping_address: data.shipping_address
            };
            items = (data.items || []).map(it => ({
              name: it.product?.name || it.name || 'Unknown Product',
              price: it.price || it.product?.price || 0,
              quantity: it.quantity
            }));
          }
          area.innerHTML = renderOrderTemplate(order, items);
        } catch (err) {
          console.error("❌ Failed to load order details:", err);
          area.innerHTML = `<div class="alert alert-danger">⚠️ Unable to load order details.<br>${err.message}</div>`;
        }
      }

      function renderStepper(status) {
        const orderStatus = status || 'Processing';
        const normalized = orderStatus.toLowerCase();
        
        if (normalized === 'cancelled') {
          return `
            <div class="order-stepper-container mb-4">
              <div class="order-stepper cancelled">
                <div class="stepper-step active">
                  <div class="step-icon-circle">✕</div>
                  <div class="step-label">Order Cancelled</div>
                </div>
              </div>
              <div class="alert alert-danger mb-0 mt-3 py-2 small text-center">
                ⚠️ This order has been cancelled.
              </div>
            </div>
          `;
        }
        
        let activeIdx = 0; // default processing
        if (normalized === 'shipped') activeIdx = 1;
        else if (normalized === 'delivered') activeIdx = 2;
        
        const steps = [
          { key: 'processing', label: 'Order Placed & Processing', num: '1' },
          { key: 'shipped', label: 'Shipped & In Transit', num: '2' },
          { key: 'delivered', label: 'Delivered', num: '3' }
        ];
        
        let html = '<div class="order-stepper-container mb-4"><div class="order-stepper">';
        
        steps.forEach((step, idx) => {
          let stepClass = '';
          let iconContent = step.num;
          
          if (idx < activeIdx) {
            stepClass = 'completed';
            iconContent = '✓';
          } else if (idx === activeIdx) {
            stepClass = 'active';
            iconContent = '✓';
          }
          
          html += `
            <div class="stepper-step ${stepClass}">
              <div class="step-icon-circle">${iconContent}</div>
              <div class="step-label">${step.label}</div>
            </div>
          `;
          
          if (idx < steps.length - 1) {
            const connClass = idx < activeIdx ? 'active' : '';
            html += `<div class="stepper-connector ${connClass}"></div>`;
          }
        });
        
        html += '</div></div>';
        return html;
      }

      // Small renderer used for both demo and server orders
      function renderOrderTemplate(order, items) {
        return `
          <h2 class="mb-4 text-center">Details for Order #${order.id}</h2>
          
          ${renderStepper(order.status)}
          
          <div class="row g-4">
            <div class="col-md-6">
              <h4>Order Summary</h4>
              <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between">
                  <span>Order Status:</span>
                  <span class="badge bg-info text-dark">${order.status || "Processing"}</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                  <span>Payment Mode:</span>
                  <strong>${order.payment_mode || "N/A"}</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                  <span>Payment Status:</span>
                  <strong>${order.payment_status || "Pending"}</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                  <span>Order Date:</span>
                  <strong>${new Date(order.created_at).toLocaleString()}</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                  <span>Order Total:</span>
                  <strong class="text-success h5 mb-0">₹${order.order_total?.toLocaleString?.() || order.order_total}</strong>
                </li>
              </ul>
            </div>
            
            <div class="col-md-6">
              <h4>Shipping Address</h4>
              <div class="card card-body bg-light">
                <p class="mb-0" style="white-space: pre-wrap;">${order.shipping_address || "Address not provided."}</p>
              </div>
            </div>
            
            <div class="col-12">
              <h4 class="mt-4">Items in this Order</h4>
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th scope="col">Product</th>
                    <th scope="col">Price</th>
                    <th scope="col">Quantity</th>
                    <th scope="col" class="text-end">Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${items.map((item) => `
                    <tr>
                      <td>${item.name}</td>
                      <td>₹${(item.price || 0).toLocaleString()}</td>
                      <td>${item.quantity}</td>
                      <td class="text-end">₹${((item.price||0) * (item.quantity||1)).toLocaleString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
          <div class="text-center mt-4">
            <a href="orders.html" class="btn btn-outline-primary">← Back to All Orders</a>
          </div>
        `;
      }

      // --- Standard Navbar Functions ---

      async function updateCartCount() {
        if (typeof window.updateGlobalCartCount === "function") {
          await window.updateGlobalCartCount();
        }
      }


    </script>
    <script>
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    </script>
  </body>

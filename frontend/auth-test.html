<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Test - Swarnika</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" src="firebase.js" defer></script>
  <script defer src="authHelper.js"></script>
</head>
<body class="p-5">
  <div class="container">
    <h1>Authentication Test Page</h1>
    <hr>
    
    <div class="card mb-3">
      <div class="card-body">
        <h5>Firebase Auth Status</h5>
        <div id="firebaseStatus" class="alert alert-secondary">Checking...</div>
        <div id="userInfo"></div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h5>authFetch Availability</h5>
        <div id="authFetchStatus" class="alert alert-secondary">Checking...</div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h5>Test Backend Call</h5>
        <button id="testBtn" class="btn btn-primary">Test Cart API</button>
        <div id="testResult" class="mt-3"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5>Console Logs</h5>
        <p class="text-muted">Open browser console (F12) to see detailed logs</p>
      </div>
    </div>
  </div>

  <script>
    const API = (function(){ const h = location.hostname; if (h === 'localhost' || h.startsWith('127.')) return `${location.protocol}//${h}:5001/api`; return '/api'; })();

    // Wait for everything to load
    setTimeout(() => {
      // Check Firebase Auth
      const firebaseStatus = document.getElementById('firebaseStatus');
      const userInfo = document.getElementById('userInfo');
      
      if (window.firebaseAuth) {
        firebaseStatus.className = 'alert alert-success';
        firebaseStatus.textContent = '✅ Firebase Auth initialized';
        
        const user = window.firebaseAuth.currentUser;
        if (user) {
          userInfo.innerHTML = `
            <div class="alert alert-info mt-2">
              <strong>Logged in as:</strong> ${user.email}<br>
              <strong>Display Name:</strong> ${user.displayName || 'Not set'}<br>
              <strong>UID:</strong> ${user.uid}
            </div>
          `;
        } else {
          userInfo.innerHTML = '<div class="alert alert-warning mt-2">⚠️ Not logged in. Please <a href="login.html">login</a> first.</div>';
        }
      } else {
        firebaseStatus.className = 'alert alert-danger';
        firebaseStatus.textContent = '❌ Firebase Auth not available';
      }

      // Check authFetch
      const authFetchStatus = document.getElementById('authFetchStatus');
      if (typeof window.authFetch === 'function') {
        authFetchStatus.className = 'alert alert-success';
        authFetchStatus.textContent = '✅ authFetch is available';
      } else {
        authFetchStatus.className = 'alert alert-danger';
        authFetchStatus.textContent = '❌ authFetch is NOT available';
      }
    }, 2000);

    // Test button
    document.getElementById('testBtn').addEventListener('click', async () => {
      const testResult = document.getElementById('testResult');
      testResult.innerHTML = '<div class="alert alert-info">⏳ Testing...</div>';

      try {
        if (!window.authFetch) {
          testResult.innerHTML = '<div class="alert alert-danger">❌ authFetch not available</div>';
          return;
        }

        console.log('🧪 Testing cart API...');
        const res = await window.authFetch(`${API}/cart`);
        console.log('📡 Response status:', res.status);
        
        if (res.ok) {
          const data = await res.json();
          console.log('📦 Cart data:', data);
          testResult.innerHTML = `
            <div class="alert alert-success">
              ✅ Success! Cart loaded.<br>
              Items: ${data.items ? data.items.length : 0}
            </div>
          `;
        } else if (res.status === 401) {
          testResult.innerHTML = '<div class="alert alert-warning">⚠️ 401 Unauthorized - Please login first</div>';
        } else {
          const errorText = await res.text();
          testResult.innerHTML = `<div class="alert alert-danger">❌ Error ${res.status}: ${errorText}</div>`;
        }
      } catch (error) {
        console.error('Test error:', error);
        testResult.innerHTML = `<div class="alert alert-danger">❌ Error: ${error.message}</div>`;
      }
    });
  </script>
</body>
</html>

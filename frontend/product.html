    <div class="product-container" id="productArea">
      <div class="text-center py-5 text-muted">
        ⏳ Loading product details...
      </div>
    </div>

    <footer>© 2025 Swarnika Jewellery | All Rights Reserved</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="apiHelper.js" defer></script>
    <script>
      // Dynamic API base: use localhost during local dev, otherwise assume backend will be served under the same origin at /api
      const API = (function () {
        let h = location.hostname;
        let proto = location.protocol;
        if (proto === "file:" || !h) {
          h = "localhost";
          proto = "http:";
        }
        if (h === "localhost" || h.startsWith("127."))
          return `${proto}//${h}:5001/api`;
        return "/api";
      })();
      const PLACEHOLDER_DATAURI = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200"><rect width="100%" height="100%" fill="%23f3f3f3"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23888" font-size="16"></text></svg>';
      const params = new URLSearchParams(location.search);
      const id = params.get("id");

      function initProductPage() {
        loadProduct();
        updateCartCount();
      }
      document.addEventListener("DOMContentLoaded", () => {
        if (window.authStateSettled) {
          initProductPage();
        } else {
          document.addEventListener("authStateSettled", initProductPage, { once: true });
        }
      });

      async function loadProduct() {
        const area = document.getElementById("productArea");
        if (!id) {
          area.innerHTML =
            '<div class="text-danger text-center py-5">❌ Invalid product ID.</div>';
          return;
        }
        area.innerHTML = '<div class="text-center py-5"><div class="loader" aria-hidden="true"></div><div class="mt-2 text-muted">Loading product...</div></div>';
        try {
          // Fetch directly from backend (bypassing Firestore)
          let p = null;
          const fetchFn = window.fetchWithFallback || ((path, opts) => fetch(`${API}${path}`, opts));
          const res = await fetchFn(`/products/${id}`, {
            credentials: "include",
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const pdata = await res.json();
          p = { id: pdata._id || pdata.id, ...pdata };
          if (!p || !p.name) throw new Error("Product not found.");
          // Construct image URL: if relative path, use API base + path; if absolute, use as-is
          let imgSrc = p.image || PLACEHOLDER_DATAURI;
          if (imgSrc.startsWith("/uploads/") || imgSrc.startsWith("uploads/")) {
            let relativePath = imgSrc;
            if (!relativePath.startsWith("/")) {
              relativePath = "/" + relativePath;
            }
            const h = location.hostname;
            const proto = location.protocol;
            if (h === "localhost" || h.startsWith("127.") || proto === "file:") {
              const port = window.detectedPort || 5001;
              imgSrc = `${proto}//${h}:${port}${relativePath}`;
            } else {
              imgSrc = relativePath;
            }
          } else if (imgSrc.startsWith("/images/") || imgSrc.startsWith("images/")) {
            let rel = imgSrc.startsWith("/") ? imgSrc.substring(1) : imgSrc;
            imgSrc = rel;
          }
          area.innerHTML = `
          <div class="row align-items-start product-fade-in">
            <div class="col-md-6 mb-4">
              <img src="${imgSrc}" class="img-fluid product-img" alt="${p.name}" onerror="if(!this.dataset.errorHandled){this.dataset.errorHandled='1';this.src=${PLACEHOLDER_DATAURI}
              />
            </div>
            <div class="col-md-6">
              <h2>${p.name}</h2>
              <p class="text-muted">${p.metal || ""} • ${p.category || ""}</p>
              <h3 class="text-primary mb-3">₹ ${
                p.price?.toLocaleString?.() || p.price || "N/A"
              }</h3>
              <p>${p.description || "No description available."}</p>
              <div class="my-3">
                <label class="form-label">Quantity</label>
                <input id="qty" class="form-control" type="number" min="1" value="1" style="max-width: 100px;">
              </div>
              <button id="addBtn" class="btn btn-primary w-100 py-2">🛒 Add to Cart</button>
              <div id="msg" class="text-center mt-3"></div>
            </div>
          </div>`;
          document
            .getElementById("addBtn")
            .addEventListener("click", addToCart);
          document
            .getElementById("addBtn")
            .addEventListener("click", addToCart);
        } catch (err) {
          console.error("❌ Failed to load product:", err);
          area.innerHTML = `<div class="text-danger text-center py-5">⚠️ Unable to load product.<br>${err.message}</div>`;
        }
      }

      async function addToCart() {
        const qty = parseInt(document.getElementById("qty").value) || 1;
        const msg = document.getElementById("msg");
        msg.textContent = "⏳ Adding to cart...";
        msg.className = "text-muted text-center mt-3";
        try {
          // Determine uid / guestId up-front so we can include it when syncing to backend
          let uid = (window.firebaseAuth && window.firebaseAuth.currentUser && window.firebaseAuth.currentUser.uid) || localStorage.getItem("guestId");
          if (!uid) {
            // create persistent guest id for anonymous users
            uid = `guest_${Date.now()}`;
            localStorage.setItem("guestId", uid);
          }

          // Use backend cart API endpoint expected by server
          const body = { productId: id, quantity: qty };
          if (uid && uid.startsWith('guest_')) {
            body.guestId = uid;
          } else {
            const storedGuest = localStorage.getItem('guestId');
            if (storedGuest) body.guestId = storedGuest;
          }
          const fetchFn = window.fetchWithFallback || ((path, opts) => fetch(`${API}${path}`, opts));
          const res = await fetchFn(`/cart/add`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(body),
          });
          const data = await res.json();

          // ✅ Handle not logged in
          if (res.status === 401) {
            msg.textContent = "Please log in to add items to cart.";
            msg.className = "text-danger text-center mt-3";
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);
            return;
          }
          
          if (!res.ok) throw new Error(data.error || "Failed to add product");

          msg.textContent = "✅ Product added to cart!";
          msg.className = "text-success text-center mt-3";
          updateCartCount();
        } catch (err) {
          console.error("❌ Add to cart failed:", err);
          msg.textContent = `❌ ${err.message}`;
          msg.className = "text-danger text-center mt-3";
        }
      }

      async function updateCartCount() {
        if (typeof window.updateGlobalCartCount === "function") {
          await window.updateGlobalCartCount();
        }
      }


    </script>
    <script>
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    </script>

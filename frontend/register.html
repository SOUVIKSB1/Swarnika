    <div class="login-container">
      <h3 class="text-center mb-4">Create Account</h3>
      <div id="msg" class="text-center mb-3 fw-semibold text-danger"></div>
      <div class="mb-3">
        <input
          id="name"
          class="form-control"
          placeholder="Full Name"
          required
        />
      </div>
      <div class="mb-3">
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="Email Address"
          required
        />
      </div>
      <div class="mb-3">
        <input
          id="phone"
          type="tel"
          class="form-control"
          placeholder="Mobile Number"
          required
        />
      </div>
      <div class="mb-3">
        <input
          id="pass"
          type="password"
          class="form-control"
          placeholder="Password"
          required
        />
      </div>
      <button id="btn" class="btn btn-primary w-100">Register</button>
      <p class="mt-3 text-center">Already have an account? <a href="login.html">Login</a></p>
    </div>


    <script type="module">
      // Firebase Auth Registration with Backend Sync
      import { auth } from "./firebase.js";
      import {
        createUserWithEmailAndPassword,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

      const API = (function(){
        const host = window.location.hostname;
        if (host === 'localhost' || host.startsWith('127.')) return `${location.protocol}//${host}:5001/api`;
        return '/api';
      })();
      const fetchWithFallback = window.fetchWithFallback || ((path, opts) => fetch(`${API}${path}`, opts));
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const phoneInput = document.getElementById("phone");
      const passInput = document.getElementById("pass");
      const registerBtn = document.getElementById("btn");
      const msg = document.getElementById("msg");

      // Check if already logged in
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          // Check if backend session exists
          try {
            const checkRes = await fetchWithFallback('/auth/me', { credentials: 'include' });
            if (checkRes.ok) {
              window.location.href = "index.html";
            }
          } catch (e) {
            // No backend session
          }
        }
      });

      registerBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const phone = phoneInput.value.trim();
        const password = passInput.value.trim();
        
        msg.classList.remove("text-success");
        msg.classList.add("text-danger");
        msg.innerText = "";

        if (!name || !email || !password || !phone) {
          msg.innerText = "⚠️ Please fill in all fields";
          return;
        }

        if (password.length < 6) {
          msg.innerText = "⚠️ Password must be at least 6 characters long";
          return;
        }

        msg.innerText = "⏳ Registering...";
        registerBtn.disabled = true;

        try {
          // Step 1: Create user with Firebase Auth
          console.log('🔐 Creating Firebase account...');
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          console.log('✅ Firebase account created');

          // Step 2: Update profile with display name
          await updateProfile(user, {
            displayName: name
          });
          console.log('✅ Display name updated');
          
          // Step 3: Get Firebase ID token
          const idToken = await user.getIdToken();
          console.log('🎫 Got Firebase ID token');
          
          // Step 4: Sync with backend to create session
          console.log('🔄 Syncing with backend...');
          const syncRes = await fetchWithFallback('/auth/firebase', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ idToken, phone })
          });
          
          if (!syncRes.ok) {
            let errorText = 'Backend sync failed';
            try {
              const errorData = await syncRes.json();
              errorText = errorData.error || JSON.stringify(errorData);
            } catch (parseErr) {
              try {
                errorText = await syncRes.text();
              } catch (tErr) {
                // ignore
              }
            }
            throw new Error(errorText || 'Backend sync failed');
          }
          
          console.log('✅ Backend session created');

          msg.classList.remove("text-danger");
          msg.classList.add("text-success");
          msg.innerText = `✅ Account created successfully! Welcome, ${name}! Redirecting...`;

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } catch (err) {
          console.error("Registration error:", err);
          msg.classList.remove("text-success");
          msg.classList.add("text-danger");

          // Handle different Firebase Auth errors
          switch (err.code) {
            case 'auth/email-already-in-use':
              msg.innerText = "❌ This email is already registered. Please login instead.";
              break;
            case 'auth/invalid-email':
              msg.innerText = "❌ Invalid email address format.";
              break;
            case 'auth/weak-password':
              msg.innerText = "❌ Password is too weak. Use at least 6 characters.";
              break;
            case 'auth/operation-not-allowed':
              msg.innerText = "❌ Email/password registration is not enabled.";
              break;
            default:
              msg.innerText = `❌ Registration failed: ${err.message}`;
          }
        } finally {
          registerBtn.disabled = false;
        }
      });
    </script>
    <script>
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    </script>

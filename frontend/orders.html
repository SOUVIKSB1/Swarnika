<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link href="styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="chat.css" />
    <script src="apiHelper.js" defer></script>
    <script type="module" src="firebase.js" defer></script>
    <script defer src="navbar.js"></script>
    <script defer src="chat.js"></script>

  </head>
  <body>
    <nav class="navbar navbar-expand-lg" role="navigation" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
          <img src="image.png" alt="Swarnika Logo" class="brand-logo" />
          <span>Swarnika Jewels</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart <span class="cart-count"></span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html?history=true">Order History</a>
            </li>
            <li class="nav-item d-none">
              <a class="nav-link" href="admin.html">Admin Panel</a>
            </li>
            <li class="nav-item d-none" id="userNameDisplay">
              <span class="nav-link text-primary fw-bold"></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="loginBtn" href="login.html">Login</a>
            </li>
            <li class="nav-item d-none" id="logoutContainer">
              <a class="nav-link" href="#" id="logoutBtn">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="loader" id="ordersLoader"></div>
    <div class="orders-container">
      <h2 class="text-center mb-4">📦 My Orders</h2>
      <div id="ordersArea" class="mt-4"></div>
    </div>

    <footer>
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;letter-spacing:1.5px;background:linear-gradient(135deg,#c9a84c,#e2c97e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.3rem">Swarnika Jewels</div>
      <div style="color:rgba(255,255,255,0.4);font-size:0.82rem">&copy; All rights reserved &middot; Developed by Souvik Sinhababu</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Dynamically determine API base URL (same as config.js)
      const API = (function () {
        let host = window.location.hostname;
        let protocol = location.protocol;
        if (protocol === "file:" || !host) {
          host = "localhost";
          protocol = "http:";
        }
        if (host === "localhost" || host.startsWith("127.")) {
            return `${protocol}//${host}:5001/api`;
          }
          return "/api";
      })();

      function initOrdersPage() {
        const params = new URLSearchParams(location.search);
        const showHistory = params.get("history") === "true";
        
        // Configure title and headers immediately to avoid layout flicker
        const titleEl = document.querySelector("h2.text-center");
        if (titleEl) {
          titleEl.textContent = showHistory ? "📜 Order History" : "📦 My Active Orders";
        }
        document.title = showHistory ? "Order History | Swarnika Jewels" : "My Orders | Swarnika Jewels";

        // Handle dynamic navbar active tab highlight underline
        const ordersLink = document.querySelector('a[href="orders.html"]');
        const historyLink = document.querySelector('a[href="orders.html?history=true"]');
        if (ordersLink && historyLink) {
          if (showHistory) {
            ordersLink.classList.remove('active');
            historyLink.classList.add('active');
          } else {
            ordersLink.classList.add('active');
            historyLink.classList.remove('active');
          }
        }

        updateCartCount();
        loadOrders();
      }
      document.addEventListener("DOMContentLoaded", () => {
        if (window.authStateSettled) {
          initOrdersPage();
        } else {
          document.addEventListener("authStateSettled", initOrdersPage, { once: true });
        }
      });

      async function loadOrders() {
        const area = document.getElementById("ordersArea");
        const loader = document.getElementById("ordersLoader");
        area.innerHTML =
          '<div class="text-muted py-5 text-center">⏳ Loading your orders...</div>';
        try {
          // Build auth headers - include JWT token and Firebase token fallbacks
          const headers = {};
          const authToken = localStorage.getItem("authToken");
          const firebaseToken = localStorage.getItem("firebaseIdToken");
          if (authToken) {
            headers["x-auth-token"] = authToken;
            console.log("📝 Using JWT token for orders");
          } else if (firebaseToken) {
            headers["Authorization"] = `Bearer ${firebaseToken}`;
            console.log("📝 Using Firebase token for orders (fallback)");
          }

          let serverOrders = [];
          try {
            const fetchFn = window.fetchWithFallback || fetch;
            const res = await fetchFn(`/orders`, { 
              credentials: "include",
              headers
            });
            if (res.status === 401) {
              // If not authenticated, still allow demo orders from localStorage to show.
              console.warn('Orders fetch returned 401 (not authenticated) — showing demo orders only');
            } 
            const data = await res.json();
            if (res.ok && Array.isArray(data)) {
              serverOrders = data;
            }
          } catch (e) {
            console.warn('Backend orders fetch failed, will include demo orders if any', e);
          }

          const params = new URLSearchParams(location.search);
          const showHistory = params.get("history") === "true";

          // Update page heading and title dynamically
          const titleEl = document.querySelector("h2.text-center");
          if (titleEl) {
            titleEl.textContent = showHistory ? "📜 Order History" : "📦 My Active Orders";
          }
          document.title = showHistory ? "Order History | Swarnika Jewels" : "My Orders | Swarnika Jewels";

          // Load demo orders from localStorage and merge (demo orders first)
          const demoOrders = JSON.parse(localStorage.getItem('demoOrders') || '[]');
          const allOrders = [...(demoOrders || []), ...(serverOrders || [])];

          // Filter based on active vs completed/cancelled
          const filteredOrders = allOrders.filter(o => {
            const status = (o.status || "Processing").toLowerCase();
            const isFinished = status === 'completed' || status === 'cancelled' || status === 'delivered' || status === 'refunded';
            return showHistory ? isFinished : !isFinished;
          });

          // If we only have demo orders (backend not available / not authenticated), show a Demo Mode banner
          const showDemoOnly = (serverOrders.length === 0) && (Array.isArray(demoOrders) && demoOrders.length > 0);

          if (filteredOrders.length === 0) {
            area.innerHTML = (showDemoOnly ? `<div class="alert alert-warning text-center">⚠️ Demo Mode — showing locally saved demo orders only. Login to view real orders.</div>` : '') + 
              (showHistory 
                ? '<div class="text-center text-muted py-5">🧾 Your order history is empty.</div>'
                : '<div class="text-center text-muted py-5">🧾 You have no active orders.</div>');
            return;
          }

          area.innerHTML = (showDemoOnly ? `<div class="alert alert-warning text-center">⚠️ Demo Mode — showing locally saved demo orders only. Login to view real orders.</div>` : '') + filteredOrders
            .map(
              (o) => {
                let badgeClass = 'bg-info text-dark';
                if (o.status === 'Cancelled' || o.status === 'demo-cancelled') {
                  badgeClass = 'bg-danger text-white';
                } else if (o.status === 'Completed' || o.status === 'demo-completed') {
                  badgeClass = 'bg-success text-white';
                } else if (o.status === 'Demo') {
                  badgeClass = 'bg-warning text-dark';
                }
                return `
          <div class="order-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="mb-0">
                <a href="order-details.html?id=${o.id || o._id}">Order #${o.id || o._id}</a>
              </h5>
              <span class="badge ${badgeClass}">${
                o.status || "Processing"
              }</span>
            </div>
            <p class="mb-1"><strong>Total:</strong> ₹${
              o.order_total?.toLocaleString?.() || o.order_total
            }</p>
            <p class="mb-1"><strong>Address:</strong> ${
              o.shipping_address || "N/A"
            }</p>
            <small class="text-muted d-block mb-3">📅 ${new Date(
              o.created_at || o.createdAt
            ).toLocaleString()}</small>
            
            <a href="order-details.html?id=${
              o.id || o._id
            }" class="btn btn-outline-primary btn-sm">View Details</a>
            ${(!showHistory && o.status !== 'Cancelled') ? `<button class="btn btn-outline-danger btn-sm cancel-btn" data-id="${
              o.id || o._id
            }" data-demo="${o.status === 'Demo' ? '1' : '0'}">Cancel Order</button>` : ''}
          </div>
        `;
              }
            )
            .join("");

          // Attach cancel button listeners
          document.querySelectorAll(".cancel-btn").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (
                !confirm(
                  "Are you sure you want to cancel this order? This will remove it permanently."
                )
              )
                return;
              try {
                const orderId = btn.dataset.id;
                const isDemo = btn.dataset.demo === '1';
                if (isDemo) {
                  // remove from local demoOrders
                  const stored = JSON.parse(localStorage.getItem('demoOrders') || '[]');
                  const filtered = (stored || []).filter(o => o.id !== orderId);
                  localStorage.setItem('demoOrders', JSON.stringify(filtered));
                  alert('❌ Demo order cancelled (local).');
                  loadOrders();
                  return;
                }
                const fetchFn = window.fetchWithFallback || fetch;
                const res = await fetchFn(`/orders/${orderId}`, {
                  method: "DELETE",
                  credentials: "include",
                });
                const data = await res.json();
                if (!res.ok)
                  throw new Error(data.error || "Failed to cancel order");
                alert("❌ Order cancelled successfully.");
                loadOrders();
              } catch (err) {
                console.error("❌ Cancel order error:", err);
                alert("⚠️ Unable to cancel order.");
              }
            });
          });
        } catch (err) {
          console.error("❌ Failed to load orders:", err);
          area.innerHTML = `<div class="text-danger text-center py-5">⚠️ Unable to load orders.<br>${err.message}</div>`;
        } finally {
          loader.style.display = "none";
        }
      }

      async function updateCartCount() {
        if (typeof window.updateGlobalCartCount === "function") {
          await window.updateGlobalCartCount();
        }
      }
    </script>
    <script>
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    </script>
    <script defer src="chat.js"></script>
  </body>
</html>

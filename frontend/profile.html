<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile — Swarnika Jewels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link href="styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="chat.css" />
    <script src="apiHelper.js" defer></script>
    <script type="module" src="firebase.js" defer></script>
    <script defer src="navbar.js"></script>
    <script defer src="chat.js"></script>
    <style>
      .profile-card {
        background: var(--grad-card);
        border: 1px solid var(--border);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-xl), var(--shadow-gold);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 2.5rem;
      }
      .form-floating > label {
        color: var(--text-muted);
      }
      .form-floating > .form-control:focus ~ label,
      .form-floating > .form-control:not(:placeholder-shown) ~ label {
        color: var(--gold-light) !important;
      }
      .form-control {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--r-md);
        transition: all 0.3s ease;
      }
      .form-control:focus {
        background: rgba(201, 168, 76, 0.04);
        border-color: var(--gold-light);
        box-shadow: 0 0 0 3px rgba(226, 201, 126, 0.15);
        color: var(--text);
      }
      .form-control[readonly] {
        background: rgba(255, 255, 255, 0.01);
        border-color: var(--border-soft);
        color: var(--text-soft);
      }
      .profile-header-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--grad-gold);
        color: #0e0c0a;
        font-family: var(--font-serif);
        font-size: 2.2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        box-shadow: 0 0 20px var(--gold-glow);
      }
      #profileLoader {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 1050;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg" role="navigation" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
          <img src="image.png" alt="Swarnika Logo" class="brand-logo" />
          <span>Swarnika Jewels</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart <span class="cart-count"></span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html?history=true">Order History</a>
            </li>
            <li class="nav-item d-none">
              <a class="nav-link" href="admin.html">Admin Panel</a>
            </li>
            <li class="nav-item d-none" id="userNameDisplay">
              <span class="nav-link text-primary fw-bold"></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="loginBtn" href="login.html">Login</a>
            </li>
            <li class="nav-item d-none" id="logoutContainer">
              <a class="nav-link" href="#" id="logoutBtn">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Loader -->
    <div id="profileLoader">
      <div class="loader"></div>
      <div class="text-muted small">Loading your Profile...</div>
    </div>

    <!-- Main Container -->
    <main class="container my-5 flex-grow-1" style="max-width: 650px;">
      <div class="profile-card">
        <div class="text-center">
          <div class="profile-header-circle" id="profileInitials">—</div>
          <h2 class="fw-bold mb-1" style="font-family: var(--font-serif); color: var(--gold-light);">Your Profile</h2>
          <p class="text-muted small mb-4">Manage your personal account details & address</p>
        </div>

        <!-- Debug Area -->
        <div class="alert alert-info small" id="debugInfo" style="display: none;">
          <strong>🔧 Debug Info:</strong>
          <div id="debugContent"></div>
        </div>

        <form id="profileForm">
          <div class="mb-4 text-center">
            <label class="form-label d-block text-muted small mb-2">Select Account Avatar or Upload Actual Image</label>
            <div class="d-flex justify-content-center align-items-center gap-3 mb-3 flex-wrap">
              <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><path d='M30 70 L70 70 L80 40 L65 55 L50 30 L35 55 L20 40 Z' fill='%23e2c97e'/><circle cx='50' cy='50' r='45' fill='none' stroke='%23c9a84c' stroke-width='2'/></svg>" class="rounded-circle avatar-select-option" style="width:50px; height:50px; cursor:pointer; transition: transform 0.2s; border: 2px solid transparent;" data-avatar-url="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><path d='M30 70 L70 70 L80 40 L65 55 L50 30 L35 55 L20 40 Z' fill='%23e2c97e'/><circle cx='50' cy='50' r='45' fill='none' stroke='%23c9a84c' stroke-width='2'/></svg>">
              <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><polygon points='50,25 75,50 50,75 25,50' fill='%234caf82'/><circle cx='50' cy='50' r='45' fill='none' stroke='%234caf82' stroke-width='2'/></svg>" class="rounded-circle avatar-select-option" style="width:50px; height:50px; cursor:pointer; transition: transform 0.2s; border: 2px solid transparent;" data-avatar-url="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><polygon points='50,25 75,50 50,75 25,50' fill='%234caf82'/><circle cx='50' cy='50' r='45' fill='none' stroke='%234caf82' stroke-width='2'/></svg>">
              <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><polygon points='50,20 68,35 60,70 40,70 32,35' fill='%234a9fd4'/><circle cx='50' cy='50' r='45' fill='none' stroke='%234a9fd4' stroke-width='2'/></svg>" class="rounded-circle avatar-select-option" style="width:50px; height:50px; cursor:pointer; transition: transform 0.2s; border: 2px solid transparent;" data-avatar-url="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><polygon points='50,20 68,35 60,70 40,70 32,35' fill='%234a9fd4'/><circle cx='50' cy='50' r='45' fill='none' stroke='%234a9fd4' stroke-width='2'/></svg>">
              <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23e8d080' stroke-width='8'/><circle cx='50' cy='24' r='9' fill='%23e05c4b'/><circle cx='50' cy='50' r='45' fill='none' stroke='%23e8d080' stroke-width='2'/></svg>" class="rounded-circle avatar-select-option" style="width:50px; height:50px; cursor:pointer; transition: transform 0.2s; border: 2px solid transparent;" data-avatar-url="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a1710'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23e8d080' stroke-width='8'/><circle cx='50' cy='24' r='9' fill='%23e05c4b'/><circle cx='50' cy='50' r='45' fill='none' stroke='%23e8d080' stroke-width='2'/></svg>">
              
              <!-- File Upload Trigger Circle -->
              <div id="uploadAvatarBtn" class="rounded-circle d-flex align-items-center justify-content-center text-muted" style="width:50px; height:50px; cursor:pointer; transition: all 0.3s; border: 2px dashed var(--border); background: rgba(255,255,255,0.02); font-size: 1.25rem;" title="Upload custom photo">
                📸
              </div>
              <input type="file" id="avatarFileInput" accept="image/*" class="d-none">
            </div>
            <div class="form-floating">
              <input type="url" id="profileImage" class="form-control" placeholder="Custom Avatar URL" style="font-size:0.85rem;" />
              <label for="profileImage">Avatar URL / Uploaded Path</label>
            </div>
          </div>

          <div class="form-floating mb-3">
            <input type="text" id="name" class="form-control" placeholder="Full Name" required />
            <label for="name">Full Name</label>
          </div>

          <div class="form-floating mb-3">
            <input type="email" id="email" class="form-control" placeholder="Email Address" required readonly />
            <label for="email">Email Address</label>
          </div>

          <div class="form-floating mb-3">
            <input type="text" id="phone" class="form-control" placeholder="Phone Number" />
            <label for="phone">Phone Number</label>
          </div>

          <div class="form-floating mb-4">
            <textarea id="address" class="form-control" placeholder="Shipping Address" style="height: 100px;"></textarea>
            <label for="address">Shipping Address</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg" id="btnSave">
            💾 Save Changes
          </button>
          
          <div id="msg" class="text-center mt-3 small"></div>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;letter-spacing:1.5px;background:linear-gradient(135deg,#c9a84c,#e2c97e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.3rem">Swarnika Jewels</div>
      <div style="color:rgba(255,255,255,0.4);font-size:0.82rem">&copy; All rights reserved &middot; Developed by Souvik Sinhababu</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script>
      // Dynamically determine API base URL
      const API = (function () {
        const host = window.location.hostname;
        if (host === "localhost" || host.startsWith("127.")) {
          return `${location.protocol}//${host}:5001/api`;
        }
        return "/api";
      })();

      document.addEventListener("DOMContentLoaded", () => {
        if (window.authStateSettled) {
          loadProfile();
        } else {
          document.addEventListener("authStateSettled", loadProfile, { once: true });
        }
      });

      async function loadProfile() {
        const msg = document.getElementById("msg");
        const loader = document.getElementById("profileLoader");
        const debugInfo = document.getElementById("debugInfo");
        const debugContent = document.getElementById("debugContent");
        
        const showDebug = localStorage.getItem('debugProfile') === '1';
        if (showDebug) debugInfo.style.display = 'block';

        if (!window.fetchWithFallback) {
          await new Promise(resolve => {
            const checkInterval = setInterval(() => {
              if (window.fetchWithFallback) {
                clearInterval(checkInterval);
                resolve();
              }
            }, 100);
            setTimeout(() => clearInterval(checkInterval), 3000);
          });
        }

        try {
          const headers = {};
          const authToken = localStorage.getItem("authToken");
          const firebaseToken = localStorage.getItem("firebaseIdToken");
          
          if (showDebug) {
            debugContent.innerHTML = `
              <div>📦 authToken: ${authToken ? '✅ Present' : '❌ Missing'}</div>
              <div>🔑 firebaseToken: ${firebaseToken ? '✅ Present' : '❌ Missing'}</div>
            `;
          }
          
          if (authToken) {
            headers["x-auth-token"] = authToken;
          } else if (firebaseToken) {
            headers["Authorization"] = `Bearer ${firebaseToken}`;
          }

          const fetchFn = window.fetchWithFallback || fetch;
          const res = await fetchFn('/auth/profile', {
            credentials: "include",
            headers
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error || `HTTP ${res.status}: Not logged in`);
          }

          const user = await res.json();
          document.getElementById("name").value = user.name || "";
          document.getElementById("email").value = user.email || "";
          document.getElementById("phone").value = user.phone || "";
          document.getElementById("address").value = user.address || "";
          document.getElementById("profileImage").value = user.profileImage || "";

          // Update initials circle / avatar
          updateAvatarDisplay(user.profileImage, user.name);
          updateAvatarHighlights(user.profileImage);
        } catch (err) {
          msg.textContent = "⚠️ Please log in to view your profile.";
          msg.className = "text-danger text-center mt-3";
          setTimeout(() => (window.location.href = "login.html"), 1500);
        } finally {
          loader.style.display = "none";
        }
      }

      function normalizeImageUrl(src) {
        if (!src) return "";
        if (src.startsWith("http://") || src.startsWith("https://") || src.startsWith("data:")) return src;
        
        let host = window.location.hostname;
        let protocol = location.protocol;
        if (protocol === "file:" || !host) {
          host = "localhost";
          protocol = "http:";
        }
        const port = 5001;
        const apiHost = (host === "localhost" || host.startsWith("127.")) ? `${protocol}//${host}:${port}` : "";
        return `${apiHost}${src.startsWith("/") ? "" : "/"}${src}`;
      }

      function updateAvatarDisplay(imgUrl, name) {
        const circle = document.getElementById("profileInitials");
        if (imgUrl) {
          circle.style.backgroundImage = `url('${normalizeImageUrl(imgUrl)}')`;
          circle.style.backgroundSize = 'cover';
          circle.style.backgroundPosition = 'center';
          circle.textContent = "";
        } else {
          circle.style.backgroundImage = "";
          const initials = name ? name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'U';
          circle.textContent = initials;
        }
      }

      function updateAvatarHighlights(selectedUrl) {
        document.querySelectorAll(".avatar-select-option").forEach(img => {
          if (img.dataset.avatarUrl === selectedUrl) {
            img.style.borderColor = "var(--gold-light)";
            img.style.transform = "scale(1.15)";
          } else {
            img.style.borderColor = "transparent";
            img.style.transform = "";
          }
        });
      }

      // Attach Avatar select options listeners
      document.querySelectorAll(".avatar-select-option").forEach(img => {
        img.addEventListener("click", () => {
          const url = img.dataset.avatarUrl;
          document.getElementById("profileImage").value = url;
          updateAvatarDisplay(url, document.getElementById("name").value);
          updateAvatarHighlights(url);
        });
      });

      // Synchronize custom URL input to circle display on change
      document.getElementById("profileImage").addEventListener("input", (e) => {
        const url = e.target.value.trim();
        updateAvatarDisplay(url, document.getElementById("name").value);
        updateAvatarHighlights(url);
      });

      // Attach File Upload Event Handlers
      const uploadAvatarBtn = document.getElementById("uploadAvatarBtn");
      const avatarFileInput = document.getElementById("avatarFileInput");
      
      if (uploadAvatarBtn && avatarFileInput) {
        uploadAvatarBtn.addEventListener("click", () => {
          avatarFileInput.click();
        });
        
        avatarFileInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          const msg = document.getElementById("msg");
          msg.textContent = "⏳ Uploading image file...";
          msg.className = "text-muted text-center mt-3";
          
          const formData = new FormData();
          formData.append("avatar", file);
          
          try {
            const headers = {};
            const authToken = localStorage.getItem("authToken");
            const firebaseToken = localStorage.getItem("firebaseIdToken");
            if (authToken) headers["x-auth-token"] = authToken;
            else if (firebaseToken) headers["Authorization"] = `Bearer ${firebaseToken}`;
            
            const fetchFn = window.fetchWithFallback || fetch;
            const res = await fetchFn('/auth/upload-avatar', {
              method: "POST",
              headers,
              credentials: "include",
              body: formData
            });
            
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Upload failed");
            
            msg.textContent = "✅ Avatar picture uploaded successfully!";
            msg.className = "text-success text-center mt-3";
            
            const uploadedUrl = data.profileImage;
            document.getElementById("profileImage").value = uploadedUrl;
            updateAvatarDisplay(uploadedUrl, document.getElementById("name").value);
            updateAvatarHighlights(uploadedUrl);
            
            // Dispatch event to navbar
            const event = new CustomEvent("profileUpdated", { 
              detail: { 
                name: document.getElementById("name").value.trim(), 
                profileImage: uploadedUrl 
              } 
            });
            document.dispatchEvent(event);
            
          } catch (err) {
            msg.textContent = `❌ Upload failed: ${err.message}`;
            msg.className = "text-danger text-center mt-3";
          }
        });
      }

      document.getElementById("profileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        const btnSave = document.getElementById("btnSave");
        msg.textContent = "⏳ Saving profile...";
        msg.className = "text-muted text-center mt-3";
        btnSave.disabled = true;

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const address = document.getElementById("address").value.trim();
        const profileImage = document.getElementById("profileImage").value.trim();

        try {
          const headers = { "Content-Type": "application/json" };
          const authToken = localStorage.getItem("authToken");
          const firebaseToken = localStorage.getItem("firebaseIdToken");
          if (authToken) headers["x-auth-token"] = authToken;
          else if (firebaseToken) headers["Authorization"] = `Bearer ${firebaseToken}`;

          const fetchFn = window.fetchWithFallback || fetch;
          const res = await fetchFn('/auth/profile', {
            method: "PUT",
            headers,
            credentials: "include",
            body: JSON.stringify({ name, phone, address, profileImage }),
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Failed to update profile");

          msg.textContent = "✅ Profile updated successfully!";
          msg.className = "text-success text-center mt-3";

          // Update Initials / Avatar preview
          updateAvatarDisplay(profileImage, name);

          // Dispatch custom event to navbar.js to update greeting instantly with name + avatar
          const event = new CustomEvent("profileUpdated", { detail: { name, profileImage } });
          document.dispatchEvent(event);
        } catch (err) {
          msg.textContent = `❌ ${err.message}`;
          msg.className = "text-danger text-center mt-3";
        } finally {
          btnSave.disabled = false;
        }
      });
    </script>
    <script>
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    </script>
  </body>

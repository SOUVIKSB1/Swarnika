<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Swarnika Jewellery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="chat.css" />
    <script src="apiHelper.js" defer></script>
    <script type="module" src="firebase.js" defer></script>
    <script defer src="navbar.js"></script>
    <script defer src="chat.js"></script>

  </head>
  <body>
    <nav class="navbar navbar-expand-lg" role="navigation" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
          <img src="image.png" alt="Swarnika Logo" class="brand-logo" />
          <span>Swarnika Jewels</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart <span class="cart-count"></span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="profile.html">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html">Orders</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="orders.html?history=true">Order History</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Admin Panel</a>
            </li>
            <li class="nav-item d-none" id="userNameDisplay">
              <span class="nav-link text-primary fw-bold"></span>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="loginBtn" href="login.html">Login</a>
            </li>
            <li class="nav-item d-none" id="logoutContainer">
              <a class="nav-link" href="#" id="logoutBtn">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="loader" id="profileLoader"></div>
    <div class="profile-container">
      <h2 class="mb-4 text-center text-primary">My Profile</h2>
      
      <!-- Debug Info (remove in production) -->
      <div class="alert alert-info small" id="debugInfo" style="display: none;">
        <strong>🔧 Debug Info:</strong>
        <div id="debugContent"></div>
      </div>
      
      <form id="profileForm">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            required
            readonly
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input
            type="text"
            id="phone"
            class="form-control"
            placeholder="Enter phone number"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <textarea
            id="address"
            class="form-control"
            rows="3"
            placeholder="Enter your address"
          ></textarea>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary px-5">
            💾 Save Changes
          </button>
        </div>
        <div id="msg" class="text-center mt-3"></div>
      </form>

      <!-- Order History Section -->
      <hr class="my-5" />
      <div class="orders-history-section">
        <h3 class="mb-4 text-center text-primary">Order History</h3>
        <div id="ordersList" class="d-flex flex-column gap-3">
          <div class="text-center text-muted py-3">⏳ Loading order history...</div>
        </div>
        <div class="text-center mt-4 mb-2">
          <a href="orders.html" class="btn btn-outline-primary px-4">View All Orders</a>
        </div>
      </div>
    </div>

    <footer class="text-center py-3 text-muted">
      © 2025 Swarnika Jewellery | All Rights Reserved
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script defer>
      // Dynamically determine API base URL (same as config.js)
      const API = (function () {
        const host = window.location.hostname;
          if (host === "localhost" || host.startsWith("127.")) {
            return `${location.protocol}//${host}:5001/api`;
          }
          return "/api";
      })();

      document.addEventListener("DOMContentLoaded", () => {
        if (window.authStateSettled) {
          loadProfile();
        } else {
          document.addEventListener("authStateSettled", loadProfile, { once: true });
        }
      });

      async function loadProfile() {
        const msg = document.getElementById("msg");
        const loader = document.getElementById("profileLoader");
        const debugInfo = document.getElementById("debugInfo");
        const debugContent = document.getElementById("debugContent");
        
        // Show debug info if localStorage has debug flag
        const showDebug = localStorage.getItem('debugProfile') === '1';
        if (showDebug) {
          debugInfo.style.display = 'block';
        }
        
        // Wait for fetchWithFallback to be available
        if (!window.fetchWithFallback) {
          console.warn("⚠️ fetchWithFallback not loaded, waiting...");
          if (showDebug) {
            debugContent.innerHTML += '<div>⏳ Waiting for fetchWithFallback...</div>';
          }
          await new Promise(resolve => {
            const checkInterval = setInterval(() => {
              if (window.fetchWithFallback) {
                clearInterval(checkInterval);
                resolve();
              }
            }, 100);
            setTimeout(() => clearInterval(checkInterval), 3000);
          });
        }
        
        try {
          console.log("🔍 Loading profile...");
          
          // Build auth headers - try JWT first, then Firebase
          const headers = {};
          const authToken = localStorage.getItem("authToken");
          const firebaseToken = localStorage.getItem("firebaseIdToken");
          
          if (showDebug) {
            debugContent.innerHTML = `
              <div>📦 authToken: ${authToken ? '✅ Present' : '❌ Missing'}</div>
              <div>🔑 firebaseToken: ${firebaseToken ? '✅ Present' : '❌ Missing'}</div>
            `;
          }
          
          if (authToken) {
            headers["x-auth-token"] = authToken;
            console.log("📝 Using JWT token for profile");
          } else if (firebaseToken) {
            headers["Authorization"] = `Bearer ${firebaseToken}`;
            console.log("📝 Using Firebase token for profile (fallback)");
          } else {
            console.log("ℹ️ No localStorage token, relying on httpOnly cookie");
            if (showDebug) {
              debugContent.innerHTML += '<div>🍪 Relying on httpOnly cookie</div>';
            }
          }
          
          // Call API with credentials (use window.fetchWithFallback or plain fetch fallback)
          const fetchFn = window.fetchWithFallback || fetch;
          const res = await fetchFn('/auth/profile', {
            credentials: "include",
            headers: headers
          });
          
          console.log("📡 Profile response status:", res.status);
          if (showDebug) {
            debugContent.innerHTML += `<div>📡 API Status: ${res.status}</div>`;
          }
          
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            console.error("❌ API returned:", errData);
            if (showDebug) {
              debugContent.innerHTML += `<div>❌ Error: ${errData.error || 'Unknown error'}</div>`;
            }
            throw new Error(errData.error || `HTTP ${res.status}: Not logged in`);
          }
          
          const user = await res.json();
          console.log("✅ Profile loaded:", user.name);
          if (showDebug) {
            debugContent.innerHTML += `<div>✅ User: ${user.name} (${user.email})</div>`;
          }

          document.getElementById("name").value = user.name || "";
          document.getElementById("email").value = user.email || "";
          document.getElementById("phone").value = user.phone || "";
          document.getElementById("address").value = user.address || "";
          
          // Load recent order history
          loadOrderHistory();
        } catch (err) {
          console.error("❌ Profile load failed:", err.message);
          if (showDebug) {
            debugContent.innerHTML += `<div>❌ Exception: ${err.message}</div>`;
          }
          msg.textContent = "⚠️ Please log in to view your profile.";
          msg.className = "text-danger text-center mt-3";
          console.log("🔄 Redirecting to login in 1.5 seconds...");
          setTimeout(() => (window.location.href = "login.html"), 1500);
        } finally {
          loader.style.display = "none";
        }
      }

      async function loadOrderHistory() {
        const listContainer = document.getElementById("ordersList");
        if (!listContainer) return;
        
        try {
          const headers = {};
          const authToken = localStorage.getItem("authToken");
          const firebaseToken = localStorage.getItem("firebaseIdToken");
          
          if (authToken) {
            headers["x-auth-token"] = authToken;
          } else if (firebaseToken) {
            headers["Authorization"] = `Bearer ${firebaseToken}`;
          }
          
          let serverOrders = [];
          try {
            const fetchFn = window.fetchWithFallback || fetch;
            const res = await fetchFn(`/orders`, {
              credentials: "include",
              headers
            });
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data)) {
                serverOrders = data;
              }
            }
          } catch (e) {
            console.warn("Failed to load orders for profile", e);
          }
          
          const demoOrders = JSON.parse(localStorage.getItem('demoOrders') || '[]');
          const allOrders = [...(demoOrders || []), ...(serverOrders || [])];
          
          if (allOrders.length === 0) {
            listContainer.innerHTML = '<div class="text-center text-muted py-3">No orders found.</div>';
            return;
          }
          
          // Show only top 3 recent orders on profile page
          const recentOrders = allOrders.slice(0, 3);
          listContainer.innerHTML = recentOrders.map(o => `
            <div class="card shadow-sm border-0 bg-light p-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold">Order #${o.id || o._id}</span>
                <span class="badge ${o.status === 'Demo' ? 'bg-warning text-dark' : 'bg-info text-dark'}">${o.status || 'Processing'}</span>
              </div>
              <div class="d-flex justify-content-between small text-muted">
                <span>Date: ${new Date(o.created_at || o.createdAt).toLocaleDateString()}</span>
                <span class="fw-bold text-dark">₹${o.order_total?.toLocaleString?.() || o.order_total}</span>
              </div>
              <div class="text-end mt-2">
                <a href="order-details.html?id=${o.id || o._id}" class="btn btn-sm btn-link text-primary p-0">Details →</a>
              </div>
            </div>
          `).join('');
          
        } catch (err) {
          console.error("Error loading order history on profile", err);
          listContainer.innerHTML = '<div class="text-center text-danger py-3">Failed to load order history.</div>';
        }
      }

      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const msg = document.getElementById("msg");
          msg.textContent = "⏳ Saving...";
          msg.className = "text-muted text-center mt-3";

          const name = document.getElementById("name").value.trim();
          const phone = document.getElementById("phone").value.trim();
          const address = document.getElementById("address").value.trim();

          try {
            // Build auth headers
            const headers = { "Content-Type": "application/json" };
            const authToken = localStorage.getItem("authToken");
            const firebaseToken = localStorage.getItem("firebaseIdToken");
            if (authToken) {
              headers["x-auth-token"] = authToken;
            } else if (firebaseToken) {
              headers["Authorization"] = `Bearer ${firebaseToken}`;
            }
            
            const fetchFn = window.fetchWithFallback || fetch;
            const res = await fetchFn('/auth/profile', {
              method: "PUT",
              headers: headers,
              credentials: "include",
              body: JSON.stringify({ name, phone, address }),
            });
            
            const data = await res.json();
            if (!res.ok)
              throw new Error(data.error || "Failed to update profile");

            msg.textContent = "✅ Profile updated successfully!";
            msg.className = "text-success text-center mt-3";
            console.log("✅ Profile saved:", name);
          } catch (err) {
            console.error("❌ Profile save error:", err);
            msg.textContent = `❌ ${err.message}`;
            msg.className = "text-danger text-center mt-3";
          }
        });

      // ✅ Using fetchWithFallback from apiHelper.js (loaded via script tag)
    </script>
    <script>
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
      }, { passive: true });
    </script>
    <script defer src="chat.js"></script>
  </body>
</html>

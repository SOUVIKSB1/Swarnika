<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Swarnika Jewels</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <script src="apiHelper.js" defer></script>
    <script type="module" src="firebase.js" defer></script>
    <script defer src="navbar.js"></script>
    <style>
      body {
        background: linear-gradient(135deg, #fffdf8, #f7e7cf);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      nav.navbar {
        width: 100%;
        background: #fffaf3;
      }
      .login-container {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        margin-top: 4rem;
        max-width: 400px;
        width: 100%;
      }
      .login-container h3 {
        color: #b6862e;
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      .btn-primary {
        background-color: #b6862e;
        border-color: #b6862e;
      }
      .btn-primary:hover {
        background-color: #9e7425;
        border-color: #9e7425;
      }
    </style>
  </head>
  <body class="p-3">
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="index.html"
        >
          <img
            src="image.png"
            alt="Swarnika Logo"
            class="brand-logo"
            style="height: 40px"
          />
          <span>Swarnika Jewels</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="register.html">Register</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="login-container">
      <h3>Welcome Back</h3>
      <div id="msg" class="text-center mb-3 fw-semibold"></div>
      <div class="mb-3">
        <input
          id="email"
          class="form-control"
          placeholder="Email"
          type="email"
        />
      </div>
      <div class="mb-3">
        <input
          id="pass"
          type="password"
          class="form-control"
          placeholder="Password"
        />
      </div>
      <button id="btn" class="btn btn-primary w-100">Login</button>
      <div class="d-grid gap-2 mt-3">
        <button id="googleBtn" class="btn btn-outline-secondary">
          Sign in with Google
        </button>
      </div>
      <p class="mt-3 text-center">
        New here? <a href="register.html">Create an account</a>
      </p>
    </div>

    <script type="module">
      // Firebase Auth Login with Backend Sync
      import { auth } from "./firebase.js";
      import {
        signInWithEmailAndPassword,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
      import { API } from "./config.js";
      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("pass");
      const loginBtn = document.getElementById("btn");
      const msg = document.getElementById("msg");

      loginBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passInput.value.trim();

        msg.className = "text-center mb-3 fw-semibold text-danger";
        msg.textContent = "";

        if (!email || !password) {
          msg.textContent = "⚠️ Please fill in both fields.";
          return;
        }

        msg.textContent = "⏳ Logging in...";
        loginBtn.disabled = true;

        try {
          // Try backend login first (handles both regular users and admin)
          console.log("🔐 Attempting backend login...");
          const loginRes = await fetchWithFallback('/auth/login', {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });

          if (loginRes.ok) {
            const loginData = await loginRes.json();
            console.log("✅ Backend login successful", loginData.user);
            
            // Store token for fallback (DEV only)
            if (location.hostname === 'localhost' || location.hostname.startsWith('127.')) {
              if (loginData.token) {
                localStorage.setItem("authToken", loginData.token);
                console.log("💾 Token stored in localStorage (dev only)");
              }
            }

            // Check if user is admin
            if (loginData.user.role === 'admin') {
              localStorage.setItem('localAdmin', '1');
              localStorage.setItem('localAdminEmail', email);
              msg.className = "text-center mb-3 fw-semibold text-success";
              msg.textContent = "✅ Admin logged in. Redirecting to admin panel...";
              setTimeout(() => { location.href = 'admin.html'; }, 600);
              return;
            }

            // Regular user: redirect to index
            msg.className = "text-center mb-3 fw-semibold text-success";
            msg.textContent = `✅ Welcome, ${loginData.user.name}! Redirecting...`;
            setTimeout(() => { location.href = 'index.html'; }, 900);
            return;
          } else if (loginRes.status === 404 || loginRes.status === 401) {
            // User not found or wrong password - fall through to Firebase
            console.log("⚠️ Backend login failed (404/401), trying Firebase...");
          } else {
            // Other backend error, still try Firebase
            console.warn("⚠️ Backend login error, falling back to Firebase...");
          }

          // Fallback to Firebase Auth for users not in backend
          console.log("🔐 Signing in with Firebase...");
          const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
          );
          const user = userCredential.user;
          console.log("✅ Firebase login successful");

          // Step 2: Get Firebase ID token
          const idToken = await user.getIdToken();
          console.log("🎫 Got Firebase ID token");

            // Step 3: Sync with backend to create session cookie
            console.log("🔄 Syncing with backend...");
            const guestId = localStorage.getItem('guestId');
            const syncRes = await fetch(`${API}/auth/firebase`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ idToken, guestId }),
            });

            if (!syncRes.ok) {
              let errorText = 'Backend sync failed';
              try {
                const errorData = await syncRes.json();
                errorText = errorData.error || JSON.stringify(errorData);
              } catch (parseErr) {
                // Not JSON (probably HTML); fall back to plain text
                try {
                  errorText = await syncRes.text();
                } catch (tErr) {
                  // ignore
                }
              }
              throw new Error(errorText || "Backend sync failed");
            }

            const syncData = await syncRes.json();
            console.log("✅ Backend session created");
            console.log("📦 Sync response:", syncData);
            console.log("🍪 Cookies after sync:", document.cookie);
            
            // Store token for fallback (DEV only)
            if (location.hostname === 'localhost' || location.hostname.startsWith('127.')) {
              if (syncData.token) {
                localStorage.setItem("authToken", syncData.token);
                console.log("💾 Token stored in localStorage as fallback (dev only)");
              }
              localStorage.setItem("firebaseIdToken", idToken);
              console.log("💾 Firebase ID token stored (dev only)");
            }
            
            await new Promise((resolve) => setTimeout(resolve, 500));

            // FALLBACK: Store token in localStorage if cookies don't work (DEV only)
            if (location.hostname === 'localhost' || location.hostname.startsWith('127.')) {
              if (syncData.token) {
                localStorage.setItem("authToken", syncData.token);
                console.log("💾 Token stored in localStorage as fallback (dev only)");
              }
              // Also store Firebase ID token for future Bearer auth if needed
              localStorage.setItem("firebaseIdToken", idToken);
              console.log("💾 Firebase ID token stored in localStorage (dev only)");
            }

            // Wait a moment for cookie to be set
            await new Promise((resolve) => setTimeout(resolve, 500));
            console.log("🍪 Cookies after delay:", document.cookie);          msg.className = "text-center mb-3 fw-semibold text-success";
          msg.textContent = `✅ Welcome, ${
            user.displayName || user.email.split("@")[0]
          }! Redirecting...`;

          setTimeout(() => {
            location.href = "index.html";
          }, 900);
        } catch (err) {
          console.error("Login error:", err);
          msg.className = "text-center mb-3 fw-semibold text-danger";

          // Handle different Firebase Auth errors
          switch (err.code) {
            case "auth/invalid-email":
              msg.textContent = "❌ Invalid email address format.";
              break;
            case "auth/user-disabled":
              msg.textContent = "❌ This account has been disabled.";
              break;
            case "auth/user-not-found":
              msg.textContent = "❌ No account found with this email. Please register.";
              break;
            case "auth/wrong-password":
              msg.textContent = "❌ Incorrect password.";
              break;
            case "auth/invalid-credential":
              msg.textContent =
                "❌ Invalid credentials. Please check your email and password.";
              break;
            case "auth/invalid-login-credentials":
              msg.textContent = "❌ Invalid email or password. Please check and try again.";
              break;
            case "auth/too-many-requests":
              msg.textContent = "❌ Too many failed attempts. Try again later.";
              break;
            default:
              msg.textContent = `❌ Login failed: ${err.message}`;
          }
        } finally {
          loginBtn.disabled = false;
        }
      });

      // Check if already logged in
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          // Verify backend session exists
          try {
            const checkRes = await fetch(`${API}/auth/me`, {
              credentials: "include",
            });
            if (checkRes.ok) {
              msg.className = "text-center mb-3 fw-semibold text-success";
              msg.textContent = `👋 Welcome back, ${
                user.displayName || user.email.split("@")[0]
              }! Redirecting...`;
              setTimeout(() => {
                location.href = "index.html";
              }, 900);
            }
          } catch (e) {
            // Backend session doesn't exist, stay on login page
          }
        }
      });
    </script>
    <!-- Firebase module + Google sign-in (module script) -->
    <script type="module">
      // Google Sign-in with Firebase and Backend Sync
      import { auth } from "./firebase.js";
      import {
        GoogleAuthProvider,
        signInWithPopup,
      } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
      import { API } from "./config.js";
      const googleBtn = document.getElementById("googleBtn");
      if (googleBtn) {
        googleBtn.addEventListener("click", async (e) => {
          const msg = document.getElementById("msg");
          try {
            googleBtn.disabled = true;
            msg.className = "text-center mb-3 fw-semibold text-primary";
            msg.textContent = "⏳ Signing in with Google...";

            // Step 1: Google Sign-in with Firebase
            console.log("🔐 Starting Google sign-in...");
            const provider = new GoogleAuthProvider();
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            console.log("✅ Google sign-in successful");

            // Step 2: Get Firebase ID token
            const idToken = await user.getIdToken();
            console.log("🎫 Got Firebase ID token");

            // Step 3: Sync with backend
            console.log("🔄 Syncing with backend...");
            const guestId = localStorage.getItem('guestId');
            const syncRes = await fetchWithFallback('/auth/firebase', {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ idToken, guestId }),
            });

            if (!syncRes.ok) {
              let errorText = 'Backend sync failed';
              try {
                const errorData = await syncRes.json();
                errorText = errorData.error || JSON.stringify(errorData);
              } catch (parseErr) {
                try {
                  errorText = await syncRes.text();
                } catch (tErr) {
                  // ignore
                }
              }
              throw new Error(errorText || "Backend sync failed");
            }

            const syncData = await syncRes.json();
            console.log("✅ Backend session created");

            // FALLBACK: Store tokens in localStorage for Bearer auth
            if (syncData.token) {
              localStorage.setItem("authToken", syncData.token);
              console.log("💾 JWT token stored in localStorage");
            }
            localStorage.setItem("firebaseIdToken", idToken);
            console.log("💾 Firebase ID token stored in localStorage");

            // Wait for cookie to be set
            await new Promise((resolve) => setTimeout(resolve, 500));

            msg.className = "text-center mb-3 fw-semibold text-success";
            msg.textContent = `✅ Welcome, ${
              user.displayName || user.email
            }! Redirecting...`;

            setTimeout(() => {
              window.location.href = "index.html";
            }, 900);
          } catch (err) {
            console.error("❌ Google sign-in failed", err);
            console.error("Error code:", err.code);
            console.error("Error message:", err.message);
            msg.className = "text-center mb-3 fw-semibold text-danger";

            if (err.code === "auth/popup-closed-by-user") {
              msg.textContent = "⚠️ Sign-in cancelled.";
            } else if (err.code === "auth/popup-blocked") {
              msg.textContent = "⚠️ Popup blocked. Please allow popups for this site.";
            } else if (err.message && err.message.includes("Failed to fetch")) {
              msg.textContent = "❌ Network error. Is your backend running? Check console for details.";
            } else if (err.code === "auth/network-request-failed") {
              msg.textContent = "❌ Network error. Check your internet connection and Firebase configuration.";
            } else if (err.message && err.message.includes("ERR_NGROK")) {
              msg.textContent = "❌ Firebase config issue. Check authorized domains in Firebase Console.";
            } else {
              msg.textContent = `❌ Google sign-in failed: ${err.message || err.code || "Unknown error"}`;
            }
          } finally {
            googleBtn.disabled = false;
          }
        });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
